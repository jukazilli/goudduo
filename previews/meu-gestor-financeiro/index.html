'use strict';const START='2026-11-13';const END='2027-12-31';const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];const bRL=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0);const n2=n=>Number(n||0);const id=()=>Math.random().toString(36).slice(2,10);const dISO=(y,m,day)=>`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const byMonth=s=>s.slice(0,7);const prettyDate=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';const datePlusMonth=(s,n)=>{let [y,m,d]=s.split('-').map(Number);let dt=new Date(y,m-1+n,1);return dISO(dt.getFullYear(),dt.getMonth()+1,Math.min(d,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()))};const esc=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));

let shopee=[['2026-12',745.95,84.77],['2027-01',723.39,60.48],['2027-02',470.52,31.83],['2027-03',470.52,31.82],['2027-04',470.60,14.13],['2027-05',451.61,14.13],['2027-06',444.56,14.13],['2027-07',444.44,14.13],['2027-08',301.86,14.11],['2027-09',123.32,0],['2027-10',96.49,0],['2027-11',83.82,0]];shopee.forEach(([ym,s,l])=>{add('SParcelado • '+ym,s,ym+'-20','expense','Shopee','Parcelamento',{confidence:'verified'});if(l)add('Empréstimos Shopee • '+ym,l,ym+'-03','expense','Shopee','Empréstimo',{confidence:'verified'})});

function expanded(){let a=[];state.transactions.forEach(t=>{if(t.repeat==='monthly'){let date=t.date;let i=0;while(date<=END&&date<=(t.until||END)&&i++<36){if(date>=START)a.push({...t,date,instance:t.id+'_'+date});date=datePlusMonth(date,1)}}else if(t.date>=START&&t.date<=END)a.push({...t,instance:t.id})});return a.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name))}function selectedEntries(m,all=true){return expanded().filter(t=>byMonth(t.date)===m && (all||t.confidence!=='unconfirmed'))}function sum(a,kind){return a.filter(t=>t.kind===kind).reduce((s,t)=>s+n2(t.amount),0)}function monthly(m,all=true){let a=selectedEntries(m,all);return {in:sum(a,'income'),out:sum(a,'expense'),net:sum(a,'income')-sum(a,'expense'),debt:a.filter(t=>t.kind==='expense'&&['Cartão','Parcelamento','Empréstimo'].includes(t.category)).reduce((s,t)=>s+t.amount,0),fixed:a.filter(t=>t.kind==='expense'&& !['Cartão','Parcelamento','Empréstimo'].includes(t.category)).reduce((s,t)=>s+t.amount,0)}}function months(){let r=[];for(let y=2026;y<=2027;y++)for(let m=1;m<=12;m++){let x=dISO(y,m,1).slice(0,7);if(x>='2026-11'&&x<='2027-12')r.push(x)}return r}function monthLabel(m){let [y,mo]=m.split('-').map(Number);return MONTHS[mo-1]+' '+y}function monthShort(m){return MONTHS[Number(m.slice(5))-1]+'/'+m.slice(2,4)}function amountStatus(t){return t.confidence==='verified'?'Extrato':t.confidence==='projected'?'Projetado':t.confidence==='assumed'?'Data estimada':t.confidence==='unconfirmed'?'A confirmar':'Informado'}

function cashProjection(){let cash=state.settings.cash;if(cash===null||cash==='')return null;return Number(cash)+expanded().filter(t=>t.date>state.settings.cashDate&&t.date<='2026-12-10'&&t.confidence!=='unconfirmed'&&!(t.kind==='income'&&t.confidence==='assumed')).reduce((s,t)=>s+(t.kind==='income'?1:-1)*t.amount,0)}

function monthBar(m){let x=monthly(m);return `<tr><td><b>${monthLabel(m)}</b></td><td class="num">${bRL(x.in)}</td><td class="num">${bRL(x.fixed)}</td><td class="num">${bRL(x.debt)}</td><td class="num ${x.net<0?'negative':'positive'}"><b>${bRL(x.net)}</b></td></tr>`}
function renderCashflow(){let rows=months(),tot=rows.reduce((s,m)=>{let x=monthly(m);return {income:s.income+x.in,out:s.out+x.out}},{income:0,out:0});return `<div class="grid"><div class="panel c12"><div class="panelhead"><div><h2>Fluxo previsto · 14 meses</h2><div class="sub">Novembro/2026 → Dezembro/2027 · previsão, não saldo disponível</div></div><div class="seg"><button class="${showUncertain?'active':''}" onclick="showUncertain=true;render()">Com receitas incertas</button><button class="${!showUncertain?'active':''}" onclick="showUncertain=false;render()">Sem receitas incertas</button></div></div><div class="kpirow"><div><span class="sub">Entradas</span><strong>${bRL(rows.reduce((s,m)=>s+monthly(m,showUncertain).in,0))}</strong></div><div><span class="sub">Saídas</span><strong>${bRL(rows.reduce((s,m)=>s+monthly(m,showUncertain).out,0))}</strong></div><div><span class="sub">Resultado do período</span><strong class="positive">${bRL(rows.reduce((s,m)=>s+monthly(m,showUncertain).net,0))}</strong></div></div><div style="margin-top:20px"><svg id="cashChart" class="spark" viewBox="0 0 900 225" role="img" aria-label="Fluxo mensal com receitas e despesas"></svg></div><div class="charttip">A data do salário, benefícios, 13º e PIS é estimada; revise em “Ajustar base”. Gastos variáveis ainda não cadastrados ficam de fora.</div></div><div class="panel c12"><h2>Detalhamento mensal</h2><div style="overflow-x:auto"><table><thead><tr><th>Mês</th><th style="text-align:right">Entradas</th><th style="text-align:right">Fixas e outros</th><th style="text-align:right">Dívidas / cartões</th><th style="text-align:right">Saldo do mês</th></tr></thead><tbody>${rows.map(m=>{let x=monthly(m,showUncertain);return `<tr><td>${monthLabel(m)}</td><td class="num">${bRL(x.in)}</td><td class="num">${bRL(x.fixed)}</td><td class="num">${bRL(x.debt)}</td><td class="num ${x.net<0?'negative':'positive'}"><b>${bRL(x.net)}</b></td></tr>`}).join('')}</tbody></table></div></div><div class="panel c12"><div class="notice warn">**Importante:** novembro de 2026 não está conciliado: salário e contas já pagas antes de 13/11 não podem ser inferidos das capturas. As datas padrão são hipóteses editáveis. Mesmo quando um mês fecha positivo, pode haver déficit antes do vencimento de uma conta.</div></div></div>`}
function renderTransactions(){let list=selectedEntries(selectedMonth),sort=list.slice().sort((a,b)=>a.date.localeCompare(b.date));let total=monthly(selectedMonth);return `<div class="tabbar"><button class="active">Lançamentos por vencimento</button><button onclick="openTransaction()">＋ Adicionar</button></div><div class="grid"><div class="panel c12"><div class="panelhead"><div><h2>Registro e acompanhamento</h2><div class="sub">Marque como pago ou edite contratos. Recorrências são editadas na origem. O status não altera valores já pagos no fluxo.</div></div><div class="monthcontrols"><button onclick="shiftMonth(-1)">‹</button><b>${monthLabel(selectedMonth)}</b><button onclick="shiftMonth(1)">›</button></div></div><div class="kpirow"><div><span class="sub">Receitas</span><strong>${bRL(total.in)}</strong></div><div><span class="sub">Saídas</span><strong>${bRL(total.out)}</strong></div><div><span class="sub">Resultado</span><strong>${bRL(total.net)}</strong></div></div></div><div class="panel c12"><div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Lançamento</th><th>Origem</th><th>Natureza</th><th style="text-align:right">Valor</th><th style="text-align:right">Ações</th></tr></thead><tbody>${sort.map(t=>`<tr><td>${prettyDate(t.date)}</td><td><b>${esc(t.name)}</b><div class="status">${esc(t.category)} · ${amountStatus(t)}${t.status==='paid'?' · Pago':''}${t.repeat?' · Recorrente':''}</div></td><td>${esc(t.source)}</td><td><span class="pill ${t.kind==='income'?'ok':''}">${t.kind==='income'?'Entrada':'Saída'}</span></td><td class="num ${t.kind==='income'?'positive':''}">${t.kind==='income'?'+':'−'} ${bRL(t.amount)}</td><td><div class="inlineactions"><button class="iconbtn" title="${t.status==='paid'?'Voltar a pendente':'Marcar pago'}" onclick="togglePaid('${t.id}')">${t.status==='paid'?'✓':'○'}</button><button class="iconbtn" title="Editar" onclick="openTransaction('${t.id}')">✎</button><button class="iconbtn" title="Excluir" onclick="removeTransaction('${t.id}')">×</button></div></td></tr>`).join('')}</tbody></table>${sort.length?'':'<div class="empty">Nenhum lançamento neste mês.</div>'}</div></div></div>`}
function shiftMonth(n){let next=datePlusMonth(selectedMonth+'-01',n).slice(0,7);if(next<'2026-11'||next>'2027-12')return;selectedMonth=next;render()}
function renderDebts(){let sources=['Shopee','PicPay','Caixa','DM (a conciliar)','Mercado Pago'];let a=expanded().filter(t=>t.kind==='expense'&&['Cartão','Parcelamento','Empréstimo'].includes(t.category));let total=a.reduce((s,t)=>s+t.amount,0);return `<div class="grid"><div class="panel c12"><div class="eyebrow">COMPROMISSOS REGISTRADOS</div><div class="metric">${bRL(total)}</div><div class="sub">Total de parcelas registradas entre 13/11/26 e 31/12/27. Não representa valor de quitação antecipada. Inclui dezembro/26.</div><div class="notice warn" style="margin-top:14px">Saldo devedor real, juros contratuais e contratos sem extrato não estão completos. Mercado Pago (R$ 166,05 em 2027, conforme resumo) e Pix Crédito aparecem como pendências de conciliação, não como débitos duplicados.</div></div>${sources.map(s=>{let ts=a.filter(t=>t.source===s),ss=ts.reduce((x,t)=>x+t.amount,0),last=ts.length?ts.map(t=>t.date).sort().at(-1):null;return `<div class="panel c3"><div class="panelhead"><div><h2>${esc(s)}</h2><div class="sub">${ts.length} pagamentos cadastrados</div></div><span class="pill ${ts.length?'':'warn'}">${ts.length?'Em projeção':'Pendente'}</span></div><div class="metric" style="font-size:27px">${bRL(ss)}</div><div class="sub">${last?'Último vencimento identificado: '+prettyDate(last):'Sem extrato futuro consolidado'}</div></div>`}).join('')}<div class="panel c12"><h2>Quando as dívidas diminuem?</h2><div style="overflow-x:auto"><table><thead><tr><th>Mês</th><th style="text-align:right">Shopee</th><th style="text-align:right">PicPay</th><th style="text-align:right">DM</th><th style="text-align:right">Total</th></tr></thead><tbody>${months().map(m=>{let x=selectedEntries(m).filter(t=>t.kind==='expense'&&['Cartão','Parcelamento','Empréstimo'].includes(t.category));let s=src=>x.filter(t=>t.source===src).reduce((v,t)=>v+t.amount,0);return `<tr><td>${monthLabel(m)}</td><td class="num">${bRL(s('Shopee'))}</td><td class="num">${bRL(s('PicPay'))}</td><td class="num">${bRL(s('DM (a conciliar)'))}</td><td class="num"><b>${bRL(x.reduce((v,t)=>v+t.amount,0))}</b></td></tr>`}).join('')}</tbody></table></div></div></div>`}
function renderGoals(){let assetsTotal=state.assets.reduce((s,a)=>s+a.value,0);return `<div class="grid"><div class="panel c1"><div class="eyebrow">PATRIMÔNIO INFORMADO</div><div class="metric">${bRL(assetsTotal)}</div><div class="sub">Saldos e investimentos cadastrados manualmente; não é sincronizado com bancos.</div><button class="btn small" style="margin-top:14px" onclick="openAsset()">＋ Registrar investimento/ativo</button></div><div class="panel c2"><div class="panelhead"><div><h2>Projetos de vida</h2><div class="sub">Dinheiro com destino antes da compra</div></div><button class="btn small primary" onclick="openGoal()">＋ Nova meta</button></div>${state.goals.length?state.goals.map(g=>`<div class="goal"><div class="flex"><strong>${esc(g.name)}</strong><span class="sub">Prazo ${prettyDate(g.deadline)}</span></div><div class="metric" style="font-size:25px">${bRL(g.saved)} <span class="sub">de ${bRL(g.target)}</span></div><div class="progress"><span style="width:${Math.min(100,100*g.saved/Math.max(1,g.target))}%"></span></div><div class="flex"><span class="sub">Faltam ${bRL(Math.max(0,g.target-g.saved))}</span><span class="sub">Guardar ~${bRL(goalInstallment(g))}/mês</span></div><div class="inlineactions" style="margin-top:10px"><button class="btn small" onclick="openGoal('${g.id}')">Editar meta</button><button class="btn small" onclick="deleteGoal('${g.id}')">Excluir</button></div></div>`).join(''):'<div class="empty"><div class="ticon">◎</div><strong>Suas metas começam aqui</strong>Cadastre quanto custa a entrada do carro ou o casamento e até quando precisa do dinheiro.<div class="suggest" style="justify-content:center"><button onclick="prefillGoal(\'Entrada do carro\')">Entrada do carro</button><button onclick="prefillGoal(\'Casamento\')">Casamento</button><button onclick="prefillGoal(\'Reserva de emergência\')">Reserva</button></div></div>'}</div><div class="panel c12"><div class="panelhead"><div><h2>Ativos e investimentos</h2><div class="sub">Renda fixa, poupança, saldo, investimentos e outros ativos</div></div><button class="btn small" onclick="openAsset()">＋ Adicionar</button></div>${state.assets.length?state.assets.map(a=>`<div class="listrow"><div class="circle">↗</div><div class="rowinfo"><strong>${esc(a.name)}</strong><small>${esc(a.type)}</small></div><b>${bRL(a.value)}</b><button class="iconbtn" onclick="openAsset('${a.id}')">✎</button><button class="iconbtn" onclick="deleteAsset('${a.id}')">×</button></div>`).join(''):'<div class="empty">Nenhum ativo informado. Seu patrimônio é desconhecido, não zero.</div>'}</div></div>`}
function goalInstallment(g){let now=new Date(2026,10,13),d=new Date(g.deadline+'T12:00:00'),m=Math.max(1,(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth());return Math.max(0,(g.target-g.saved)/m)}
function simulate(){let v=n2(scenario.value),install=Math.max(1,n2(scenario.installments)),per=v/install;let m=scenario.month;let blocks=[];for(let i=0;i<install;i++){let ym=datePlusMonth(m+'-01',i).slice(0,7);if(ym>'2027-12')break;let x=monthly(ym,false);blocks.push({m:ym,before:x.net,after:x.net-per})}return {per,blocks,worst:blocks.length?Math.min(...blocks.map(x=>x.after)):0}}
function renderSimulator(){let s=simulate();return `<div class="grid"><div class="panel c3"><div class="eyebrow">PLANEJAR ANTES DE COMPRAR</div><h2 style="margin-top:9px">E se eu comprar agora?</h2><p class="sub">Teste entrada do carro, viagem ou qualquer compra. O simulador não cria dívidas automaticamente.</p><div class="fields" style="margin-top:19px"><div class="field"><label>Valor total (R$)</label><input inputmode="decimal" type="number" min="0" step="0.01" id="simValue" value="${scenario.value}" oninput="scenario.value=Number(this.value);updateSim()"></div><div class="field"><label>Número de parcelas</label><input type="number" min="1" max="72" id="simN" value="${scenario.installments}" oninput="scenario.installments=Number(this.value);updateSim()"></div><div class="field"><label>Primeira parcela</label><input type="month" min="2026-11" max="2027-12" value="${scenario.month}" onchange="scenario.month=this.value;updateSim()"></div></div><div class="notice warn" style="margin-top:15px">Por padrão, simulação sem juros. Compare o CET antes de aceitar parcelamento ou crédito. Uma compra no cartão já reduz seu poder de compra futuro.</div></div><div class="panel c3"><div class="eyebrow">IMPACTO MENSAL</div><div class="metric" id="simMonthly">${bRL(s.per)}</div><div class="sub">Nova parcela hipotética</div><div class="divider"></div><div id="simResult">${simResultHTML(s)}</div><div class="suggest"><button onclick="scenario.value=1500;scenario.installments=10;scenario.month='2027-01';render()">Exemplo: R$ 1.500 / 10x</button><button onclick="scenario.value=5000;scenario.installments=12;scenario.month='2027-01';render()">Exemplo: R$ 5.000 / 12x</button></div></div><div class="panel c12"><div class="panelhead"><div><h2>Como a compra muda seus meses</h2><div class="sub">Comparação antes/depois · sem juros ou outros custos de compra</div></div><button class="btn small primary" onclick="commitScenario()">Adicionar parcelas ao planejamento</button></div><div id="simTable">${simTableHTML(s)}</div></div></div>`}
function simResultHTML(s){return `<div class="eyebrow">MENOR SOBRA MENSAL NO PERÍODO</div><div class="metric ${s.worst<0?'negative':'positive'}" style="font-size:27px">${bRL(s.worst)}</div><div class="notice ${s.worst<0?'warn':'good'}">${s.worst<0?'Essa compra criaria mês com despesas maiores que receitas cadastradas. Não é prudente sem reserva ou renda adicional.':'O cenário cabe no fluxo mensal teórico, mas isso NÃO prova que você tem caixa hoje. Confirme saldo, vencimentos e outras despesas.'}</div>`}
function simTableHTML(s){return `<div style="overflow:auto"><table><thead><tr><th>Mês</th><th style="text-align:right">Antes</th><th style="text-align:right">Nova parcela</th><th style="text-align:right">Depois</th></tr></thead><tbody>${s.blocks.map(x=>`<tr><td>${monthLabel(x.m)}</td><td class="num">${bRL(x.before)}</td><td class="num">${bRL(s.per)}</td><td class="num ${x.after<0?'negative':'positive'}">${bRL(x.after)}</td></tr>`).join('')}</tbody></table></div>`}
function updateSim(){let s=simulate();document.getElementById('simMonthly').textContent=bRL(s.per);document.getElementById('simResult').innerHTML=simResultHTML(s);document.getElementById('simTable').innerHTML=simTableHTML(s)}function commitScenario(){if(n2(scenario.value)<=0||n2(scenario.installments)<1)return toast('Preencha um valor e parcelas válidas.');if(!confirm('Registrar as parcelas simuladas no seu planejamento?'))return;let s=simulate(),name=prompt('Qual o nome da compra planejada?','Compra simulada');if(!name)return;s.blocks.forEach(x=>state.transactions.push({id:id(),name:name,amount:s.per,date:x.m+'-15',kind:'expense',source:'Planejado',category:'Parcelamento',confidence:'assumed',status:'planned'}));save();toast('Parcelas cadastradas no planejamento.');go('transactions')}
function plot(svgId,monthsArr,type){let svg=document.getElementById(svgId);if(!svg)return;let W=type==='wide'?900:740,H=type==='wide'?225:190,pad=25,chartH=H-48,vals=monthsArr.map(m=>monthly(m,showUncertain)),mx=Math.max(100,...vals.flatMap(v=>[v.in,v.out]))*1.12;let slot=(W-2*pad)/vals.length;let grid=[0,.25,.5,.75,1].map(p=>`<line x1="${pad}" y1="${chartH*p+9}" x2="${W-pad}" y2="${chartH*p+9}" stroke="#eef1f3"/>`).join('');let bars=vals.map((v,i)=>{let y=chartH+9,xx=pad+slot*i+slot*.12,h=v.out/mx*chartH,hh=v.in/mx*chartH;return `<rect x="${xx}" y="${y-h}" width="${slot*.36}" height="${h}" fill="#9bacb8" rx="4"><title>${monthLabel(monthsArr[i])} despesas ${bRL(v.out)}</title></rect><rect x="${xx+slot*.39}" y="${y-hh}" width="${slot*.36}" height="${hh}" fill="#2b7dcd" rx="4"><title>${monthLabel(monthsArr[i])} entradas ${bRL(v.in)}</title></rect><text x="${xx+slot*.38}" y="${H-7}" font-size="10" fill="#82909a" text-anchor="middle">${MONTHS[Number(monthsArr[i].slice(5))-1]}</text>`}).join('');svg.innerHTML=grid+bars;}
function drawOverviewChart(){plot('overviewChart',months().slice(1),'normal')}function drawCashChart(){plot('cashChart',months(),'wide')}
function modal(html){document.getElementById('modalMount').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}function closeModal(){document.getElementById('modalMount').innerHTML=''}
function openSettings(){let s=state.settings;modal(`<div class="flex"><h2>Ajustar base financeira</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="sub">Esses dados definem a diferença entre uma previsão e dinheiro realmente disponível. As datas de recebimento nas transações são editáveis.</p><form id="settingsForm" onsubmit="submitSettings(event)"><div class="fields"><div class="field"><label>Saldo bancário em ${prettyDate(START)} (R$)</label><input name="cash" type="number" step="0.01" placeholder="Deixe vazio se desconhecido" value="${s.cash??''}"></div><div class="field"><label>Teto flexível mensal (R$)</label><input name="flexBudget" type="number" step="0.01" min="0" value="${s.flexBudget}"></div><div class="field"><label>Margem de segurança (R$)</label><input name="safety" type="number" min="0" step="0.01" value="${s.safety}"></div></div><div class="notice warn" style="margin-top:15px">Se já houve pagamentos depois de 13/11, registre-os como pagos ou ajuste a data-base. Saldo inicial não é o limite dos seus cartões.</div><div class="modalfooter"><button type="button" class="btn" onclick="exportJSON()">Exportar backup</button><button type="button" class="btn" onclick="document.getElementById('importFile').click()">Importar</button><input type="file" id="importFile" style="display:none" accept="application/json" onchange="importJSON(event)"><button class="btn primary" type="submit">Salvar alterações</button></div></form>`)}
function submitSettings(e){e.preventDefault();let f=new FormData(e.target);state.settings.cash=f.get('cash')===''?null:Number(f.get('cash'));state.settings.flexBudget=Math.max(0,Number(f.get('flexBudget')));state.settings.safety=Math.max(0,Number(f.get('safety')));save();closeModal();render();toast('Base financeira salva neste navegador.')}
function openTransaction(tid){let t=state.transactions.find(x=>x.id===tid),isEdit=!!t;let dt=t?.date||'2026-12-15';modal(`<div class="flex"><h2>${isEdit?'Editar':'Novo'} lançamento</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="sub">Para recorrências, a edição atualiza toda a série. Em compras parceladas, registre cada prestação ou use o simulador.</p><form id="trForm" onsubmit="submitTransaction(event,'${tid||''}')"><div class="fields"><div class="field"><label>Descrição</label><input name="name" required maxlength="120" value="${esc(t?.name||'')}" placeholder="Ex.: Transporte"></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" step="0.01" min="0.01" required value="${t?.amount||''}"></div><div class="field"><label>Vencimento</label><input name="date" type="date" min="2026-11-13" max="2027-12-31" required value="${dt}"></div><div class="field"><label>Natureza</label><select name="kind"><option value="expense" ${t?.kind==='expense'?'selected':''}>Despesa</option><option value="income" ${t?.kind==='income'?'selected':''}>Receita</option></select></div><div class="field"><label>Instituição / origem</label><input name="source" required value="${esc(t?.source||'Manual')}" maxlength="60"></div><div class="field"><label>Categoria</label><select name="category">${['Moradia','Alimentação','Educação','Saúde','Assinaturas','Transporte','Lazer','Cartão','Empréstimo','Parcelamento','Salário','Benefício','13º','PIS','Investimento','Outros'].map(c=>`<option ${t?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Recorrência</label><select name="repeat"><option value="" ${!t?.repeat?'selected':''}>Uma vez</option><option value="monthly" ${t?.repeat==='monthly'?'selected':''}>Todo mês até dez/2027</option></select></div><div class="field"><label>Confiabilidade</label><select name="confidence">${[['verified','Extrato'],['informed','Informado'],['projected','Projetado'],['assumed','Estimado'],['unconfirmed','A confirmar']].map(([a,b])=>`<option value="${a}" ${t?.confidence===a?'selected':''}>${b}</option>`).join('')}</select></div></div><div class="modalfooter"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">${isEdit?'Salvar':'Adicionar'} lançamento</button></div></form>`)}
function submitTransaction(e,tid){e.preventDefault();let f=new FormData(e.target),t={id:tid||id(),name:String(f.get('name')),amount:Number(f.get('amount')),date:String(f.get('date')),kind:String(f.get('kind')),source:String(f.get('source')),category:String(f.get('category')),confidence:String(f.get('confidence')),status:'planned',repeat:String(f.get('repeat'))};if(!t.repeat)delete t.repeat;else {t.until=END;t.day=Number(t.date.slice(8))}if(!Number.isFinite(t.amount)||t.amount<=0)return toast('Valor inválido.');let i=state.transactions.findIndex(x=>x.id===tid);if(i>=0)state.transactions[i]=t;else state.transactions.push(t);save();closeModal();render();toast('Lançamento salvo.')}
function togglePaid(tid){let t=state.transactions.find(x=>x.id===tid);if(!t)return;t.status=t.status==='paid'?'planned':'paid';save();render();toast(t.status==='paid'?'Marcado como pago.':'Marcado como pendente.')}function removeTransaction(tid){if(!confirm('Excluir este lançamento? Se for recorrente, toda a série será excluída.'))return;state.transactions=state.transactions.filter(x=>x.id!==tid);save();render();toast('Lançamento excluído.')}function prefillGoal(name){openGoal('',name)}function openGoal(gid,name=''){let g=state.goals.find(x=>x.id===gid);modal(`<div class="flex"><h2>${g?'Editar':'Criar'} meta</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="sub">Torne objetivos caros em pequenas decisões mensais.</p><form onsubmit="submitGoal(event,'${gid||''}')"><div class="fields"><div class="field"><label>Nome</label><input name="name" required value="${esc(g?.name||name)}" placeholder="Ex.: Entrada do carro"></div><div class="field"><label>Valor-alvo (R$)</label><input name="target" required min="1" type="number" step=".01" value="${g?.target||''}"></div><div class="field"><label>Já reservado (R$)</label><input name="saved" required min="0" type="number" step=".01" value="${g?.saved||0}"></div><div class="field"><label>Prazo</label><input name="deadline" required type="date" min="2026-11-13" value="${g?.deadline||'2027-12-31'}"></div></div><div class="modalfooter"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Salvar meta</button></div></form>`)}function submitGoal(e,gid){e.preventDefault();let f=new FormData(e.target);let g={id:gid||id(),name:String(f.get('name')),target:Number(f.get('target')),saved:Number(f.get('saved')),deadline:String(f.get('deadline'))};let i=state.goals.findIndex(x=>x.id===gid);if(i<0)state.goals.push(g);else state.goals[i]=g;save();closeModal();render();toast('Meta atualizada.')}function deleteGoal(id){if(!confirm('Excluir esta meta?'))return;state.goals=state.goals.filter(g=>g.id!==id);save();render()}
function openAsset(aid){let a=state.assets.find(x=>x.id===aid);modal(`<div class="flex"><h2>${a?'Editar':'Novo'} ativo</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="submitAsset(event,'${aid||''}')"><div class="fields" style="margin-top:16px"><div class="field"><label>Nome</label><input name="name" required value="${esc(a?.name||'')}"></div><div class="field"><label>Tipo</label><select name="type">${['Conta bancária','Poupança','Renda fixa','Fundos','Ações','Outros'].map(v=>`<option ${a?.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Valor de mercado / saldo (R$)</label><input name="value" type="number" required step="0.01" min="0" value="${a?.value||0}"></div></div><div class="modalfooter"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar ativo</button></div></form>`)}function submitAsset(e,aid){e.preventDefault();let f=new FormData(e.target);let a={id:aid||id(),name:String(f.get('name')),type:String(f.get('type')),value:Number(f.get('value'))};let i=state.assets.findIndex(x=>x.id===aid);if(i<0)state.assets.push(a);else state.assets[i]=a;save();closeModal();render();toast('Ativo salvo.')}function deleteAsset(id){if(!confirm('Excluir este ativo?'))return;state.assets=state.assets.filter(a=>a.id!==id);save();render()}
function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-gestor-financeiro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importJSON(e){let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.version!==2||!Array.isArray(obj.transactions)||!Array.isArray(obj.goals))throw Error();if(!confirm('Substituir todos os registros atuais pelo backup?'))return;state=obj;save();closeModal();render();toast('Backup importado.')}catch(err){toast('Arquivo incompatível com este protótipo.')}};reader.readAsText(f)}
render();
</script></body></html>
