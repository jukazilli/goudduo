if(id==='trajectory'){return `<div class="module-summary"><strong class="bold">2027</strong><p class="small-note">Previsão mensal separada do saldo real</p></div><div class="module-expansion"><p class="small-note">Os meses incluem despesas cadastradas e renda estimada. Gastos não registrados e receitas incertas podem alterar o resultado.</p><div class="module-actions"><button class="minor-action" data-action="navigate" data-to="plan">Examinar fluxo</button></div></div>`}return ''}
function moduleView(id){const [label,ic]=MODULES[id]||MODULES.spending,open=!!state.expanded[id];return `<article class="module-card ${open?'open':''}" data-module="${id}" draggable="${state.organizing?'true':'false'}"><button class="module-head" data-action="toggle-module" data-id="${id}" aria-expanded="${open}"><div class="module-title"><span class="soft-mark">${icon(ic,19)}</span><span><span class="section-title">${label}</span><span class="module-meta">${id==='commitments'?'Vencimentos conhecidos':id==='people'?'Empréstimos entre pessoas':id==='spending'?'Consumo além das contas fixas':id==='cards'?'Por instituição':id==='goals'?'Conquistas planejadas':'Evolução do dinheiro'}</span></span></div><span class="expand-icon">${icon('down',18)}</span></button>${moduleBody(id)}${state.organizing?`<div class="reorder-controls"><button class="outline-btn" data-action="move-module" data-id="${id}" data-dir="-1" aria-label="Mover card para cima">${icon('up',16)} Subir</button><button class="outline-btn" data-action="move-module" data-id="${id}" data-dir="1" aria-label="Mover card para baixo">${icon('down',16)} Descer</button><button class="outline-btn" data-action="hide-module" data-id="${id}" aria-label="Ocultar card">Ocultar</button></div>`:''}</article>`}
function homeView(){let ordered=state.homeOrder.filter(id=>MODULES[id]&&!state.hiddenModules.includes(id));return `<div class="home-layout ${state.organizing?'is-organizing':''}"><div class="home-primary">${homeHero()}${todayFlow()}${state.organizing?`<div class="insight" style="margin-top:15px">Modo de organização ativo. Use subir ou descer, ou arraste os cards.</div>`:''}</div><div class="home-secondary">${state.organizing?`<div class="brief-row" style="margin-bottom:14px"><strong>Organizar minha Home</strong><button class="minor-action" data-action="organize">Concluir</button></div>`:''}<div id="moduleList">${ordered.map(moduleView).join('')}</div>${state.hiddenModules.length?`<button class="outline-btn" data-action="show-modules">Restaurar ${state.hiddenModules.length} módulo(s)</button>`:''}</div></div>`}
function pageHeader(title,caption,action=''){return `<div class="page-header"><div><h1>${title}</h1><p>${caption}</p></div>${action}</div>`}
function movementsView(){const filter=state.movementFilter;const tx=state.transactions.filter(t=>filter==='all'||t.kind===filter).sort((a,b)=>b.date.localeCompare(a.date));return `${pageHeader('Movimentos','Entradas, saídas e transferências. O histórico confirmado é a base para descobrir onde o dinheiro foi.',`<button class="primary-btn" data-action="transaction" data-kind="expense">${icon('plus',18)} Novo lançamento</button>`)}<div class="inline-tabs" style="margin-bottom:16px">${[['all','Todos'],['expense','Saídas'],['income','Entradas'],['lend','Empréstimos'],['transfer','Transferências']].map(([v,t])=>`<button class="tab-btn ${filter===v?'active':''}" data-action="movement-filter" data-filter="${v}">${t}</button>`).join('')}</div><div class="section-box">${tx.length?tx.map(t=>`<div class="tx-row"><div class="tx-info"><span class="row-ic">${icon(['income','repayment'].includes(t.kind)?'income':t.kind==='transfer'?'arrows':t.kind==='lend'?'hand':'out',19)}</span><div><strong>${e(t.name)}</strong><small>${displayDate(t.date)} · ${e(t.category||'Movimento')} · ${t.status==='confirmed'?'Confirmado':'Previsto'}</small></div></div><div class="tx-amount"><strong class="nums ${['income','repayment'].includes(t.kind)?'in':''}">${['income','repayment'].includes(t.kind)?'+ ':['expense','lend'].includes(t.kind)?'− ':''}${moneyShown(t.amount)}</strong>${['lend','repayment'].includes(t.kind)?'':`<button class="micro-btn" data-action="edit-transaction" data-id="${e(t.id)}" title="Editar lançamento">${icon('edit',16)}</button>`}</div></div>`).join(''):`<div class="empty-state" style="text-align:center;padding:45px 0"><div style="color:#51735c">${icon('receipt',31)}</div><h3 style="margin:12px 0 5px">Seu histórico começa aqui</h3><p class="muted small">Registre suas movimentações para identificar os gastos que passam despercebidos.</p><button class="minor-action" style="margin-top:17px" data-action="transaction" data-kind="expense">Registrar gasto</button></div>`}</div><div class="insight" style="margin-top:15px">Pagar a fatura de um cartão não representa uma segunda compra. Na versão final, o motor de conciliação vinculará cada compra ao respectivo pagamento.</div>`}
function forecastTable(){return `<div class="table-wrap"><table class="finance-table"><thead><tr><th>Mês</th><th class="n">Entradas previstas</th><th class="n">Saídas previstas</th><th class="n">Reserva</th><th class="n">Diferença</th></tr></thead><tbody>${MONTHS.slice(1).map(k=>{const f=forecast(k);return `<tr><td><strong>${e(monthName(k))}</strong></td><td class="n">${moneyShown(f.income)}</td><td class="n">${moneyShown(f.expenses)}</td><td class="n">${moneyShown(f.reserved)}</td><td class="n ${f.net<0?'negative':'positive'}">${state.hideMoney?'R$ ••••':fmt(f.net)}</td></tr>`}).join('')}</tbody></table></div>`}
function planView(){const tab=state.planTab;let content='';if(tab==='flow'){const y=MONTHS.slice(2),vals=y.map(k=>forecast(k)),gross=vals.reduce((s,t)=>s+t.income,0),out=vals.reduce((s,t)=>s+t.expenses,0);const peak=Math.max(5000,...vals.map(v=>Math.max(v.income,v.expenses)));content=`<div class="grid-two" style="margin-bottom:14px"><article class="stat-block"><div class="key">Entradas de caixa previstas · 2027</div><div class="value nums">${moneyShown(gross)}</div><div class="small muted">Não são saldos confirmados</div></article><article class="stat-block"><div class="key">Saídas de caixa previstas · 2027</div><div class="value nums">${moneyShown(out)}</div><div class="small muted">Outros gastos podem existir</div></article></div><div class="section-box"><div class="brief-row"><h2>Fluxo mensal</h2><button class="outline-btn" data-action="open-income">${icon('edit',16)} Fontes de renda</button></div><div class="money-graph" aria-label="Gráfico ilustrativo de entradas e saídas por mês">${vals.map((f,i)=>`<div class="graph-col" title="${e(monthName(y[i]))} • Entradas ${fmt(f.income)} • Saídas ${fmt(f.expenses)}"><div class="bar" style="height:${Math.max(2,100*f.expenses/peak)}%"></div><div class="bar in" style="height:${Math.max(2,100*f.income/peak)}%"></div><span class="period">${shortName(y[i])}</span></div>`).join('')}</div><div class="brief-row small muted" style="margin:26px 0 16px"><span>■ Cinza: saídas</span><span style="color:#28684b">■ Verde: entradas previstas</span></div>${forecastTable()}</div><div class="insight warn" style="margin-top:14px">Somar diferenças mensais não informa quanto existe na conta. O resultado depende de receitas previstas, gastos não registrados e pagamentos reais.</div>`}
if(tab==='cards'){content=`<div class="grid-three">${[['Shopee','SParcelado e empréstimos',4275.89,'Até nov/27'],['PicPay','Parcelas futuras',596.45,'Até abr/27'],['DM','Parcelamentos de fatura',2585.5,'Até nov/27']].map(([title,desc,amt,due])=>`<article class="stat-block"><div class="smallcaps">${title}</div><div class="value nums">${moneyShown(amt)}</div><div class="key">${desc}</div><div class="small muted" style="margin-top:8px">${due}</div></article>`).join('')}</div><div class="section-box" style="margin-top:14px"><h2>Vencimentos e instituições</h2><p class="small muted" style="margin:8px 0 12px">Pagamentos futuros identificados: ${moneyShown(7457.84)} em 2027. Não equivalem ao saldo para quitação antecipada.</p><div class="table-wrap"><table class="finance-table"><thead><tr><th>Data</th><th>Compromisso</th><th>Instituição</th><th class="n">Valor</th></tr></thead><tbody>${state.bills.filter(x=>x.date>='2026-12-01').slice(0,40).map(x=>`<tr><td>${displayDate(x.date)}</td><td>${e(x.name)}</td><td>${e(x.account)}</td><td class="n">${moneyShown(x.amount)}</td></tr>`).join('')}</tbody></table></div></div><div class="insight warn" style="margin-top:14px">Caixa e Mercado Pago ainda necessitam reconciliação; não foram inventadas parcelas futuras para essas instituições.</div>`}
if(tab==='simulate'){const s=state.sim;let res='';if(s){const am=s.price/s.parts,start=MONTHS.indexOf(s.start);const months=MONTHS.slice(start,Math.min(MONTHS.length,start+s.parts));res=`<div class="stat-block" style="margin-top:15px"><div class="key">Parcela estimada</div><div class="value">${moneyShown(am)}</div><div class="small muted">${s.parts}x · ${moneyShown(s.price)} · Sem juros adicionais modelados</div><div class="muted-divider"></div>${months.length?months.map(k=>{const f=forecast(k);return `<div class="mini-row"><span>${monthName(k)}</span><strong style="color:${f.net-am<0?'var(--danger)':'var(--ink)'}">${moneyShown(f.net-am)}</strong></div>`}).join(''):'<p class="muted">Período fora do horizonte de simulação.</p>'}<p class="small-note" style="margin-top:12px">Resultados mensais não garantem que haverá dinheiro na data do vencimento.</p></div>`}content=`<div class="grid-two"><section class="section-box"><h2>Antes de comprar</h2><p class="small muted" style="margin:6px 0 18px">Teste uma decisão sem assumir nova dívida.</p><form id="simulationForm" class="fields"><div class="field"><label for="simLabel">Compra ou objetivo</label><input id="simLabel" name="name" placeholder="Ex.: viagem, celular" value="${e(s?.name||'')}" required></div><div class="field-grid"><div class="field"><label for="simAmount">Preço total</label><input id="simAmount" name="price" type="number" step="0.01" min="0.01" placeholder="R$" value="${s?.price||''}" required></div><div class="field"><label for="simParts">Parcelas</label><select id="simParts" name="parts">${[1,2,3,4,5,6,8,10,12,18,24].map(n=>`<option ${s?.parts===n?'selected':''} value="${n}">${n}x</option>`).join('')}</select></div></div><div class="field"><label for="simStart">Primeiro vencimento</label><select id="simStart" name="start">${MONTHS.slice(1).map(k=>`<option ${s?.start===k?'selected':''} value="${k}">${monthName(k)}</option>`).join('')}</select></div><button class="primary-btn">${icon('activity',18)} Simular impacto</button></form></section><div><div class="insight">Limite de cartão não é renda disponível. Uma parcela que cabe no mês pode comprometer o caixa em um dia específico.</div>${res}</div></div>`}
return `${pageHeader('Planejamento','Compromissos, cenários e consequências antes das decisões.') }<div class="inline-tabs" style="margin-bottom:18px">${[['flow','Fluxo'],['cards','Cartões e dívidas'],['simulate','Simulador']].map(([k,l])=>`<button class="tab-btn ${tab===k?'active':''}" data-action="plan-tab" data-tab="${k}">${l}</button>`).join('')}</div>${content}`}
function goalsView(){return `${pageHeader('Objetivos','Dinheiro reservado de verdade transforma vontade em possibilidade.',`<button class="primary-btn" data-action="goal-new">${icon('plus',18)} Novo objetivo</button>`)}<div class="goals-grid">${state.goals.map(g=>`<article class="goal-card"><div class="brief-row"><div class="soft-mark">${icon('target',20)}</div><button class="micro-btn" title="Editar objetivo" data-action="goal-edit" data-id="${e(g.id)}">${icon('edit',17)}</button></div><div class="title" style="margin-top:18px">${e(g.name)}</div><div class="goal-value nums">${moneyShown(g.saved)}</div><div class="goal-sub">${g.target?`de ${moneyShown(g.target)} · ${g.due?'até '+displayDate(g.due):'sem prazo'}`:'Defina o valor desejado'}</div><div class="soft-track" style="margin:14px 0 16px"><i style="width:${g.target?Math.min(100,100*g.saved/g.target):0}%"></i></div><button class="outline-btn" data-action="goal-deposit" data-id="${e(g.id)}">${icon('plus',16)} Planejar aporte</button></article>`).join('')}</div><div class="insight" style="margin-top:15px">Uma meta não aumenta patrimônio por si só. Os aportes devem ser vinculados a dinheiro real antes de serem contabilizados como saldo guardado.</div>`}
function wealthView(){const cash=effectiveBalance(),lent=personSummary(),other=state.assets.reduce((s,x)=>s+x.amount,0);return `${pageHeader('Patrimônio','Ativos e compromissos reais, não somatórios de sobras futuras.',`<button class="primary-btn" data-action="asset-new">${icon('plus',18)} Adicionar ativo</button>`)}<div class="grid-three" style="margin-bottom:14px"><article class="stat-block"><div class="key">Dinheiro em conta</div><div class="value nums">${cash==null?'Não informado':moneyShown(cash)}</div></article><article class="stat-block"><div class="key">A receber de pessoas</div><div class="value nums">${moneyShown(lent)}</div></article><article class="stat-block"><div class="key">Ativos registrados</div><div class="value nums">${moneyShown(other)}</div></article></div><div class="section-box"><div class="section-top"><h2>Ativos e investimentos</h2><button class="minor-action" data-action="open-balance">Reconciliar conta</button></div>${state.assets.length?state.assets.map(x=>`<div class="mini-row"><div><strong>${e(x.name)}</strong><p class="sub">${e(x.kind)}</p></div><div class="row-left"><strong>${moneyShown(x.amount)}</strong><button class="micro-btn" data-action="asset-edit" data-id="${e(x.id)}">${icon('edit',16)}</button></div></div>`).join(''):'<p class="empty-state">Nenhum investimento registrado.</p>'}<div class="muted-divider"></div><h3>Valores a receber</h3>${state.people.filter(x=>x.remaining>0).map(x=>`<div class="mini-row"><span>${e(x.name)}</span><strong>${moneyShown(x.remaining)}</strong></div>`).join('')||'<div class="empty-state">Sem valores pendentes.</div>'}</div><div class="insight warn" style="margin-top:14px">Não calculamos patrimônio líquido completo enquanto faltarem saldos de dívidas, cartões, contas e ativos. Dinheiro emprestado pode não ser recuperado.</div>`}
function render(){navRender();const r={home:homeView,movements:movementsView,plan:planView,goals:goalsView,wealth:wealthView};document.getElementById('app').innerHTML=(r[state.section]||homeView)();if(state.organizing)attachDrag()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._timeout);toast._timeout=setTimeout(()=>el.classList.remove('show'),3100)}
function showSheet(title,body){document.getElementById('sheetContent').innerHTML=`<div class="sheet-header"><h2 id="sheetTitle">${title}</h2><button class="icon-btn soft" data-action="close-sheet" aria-label="Fechar">${icon('close',19)}</button></div>${body}`;const l=document.getElementById('sheetLayer');l.classList.remove('hidden');l.setAttribute('aria-hidden','false');const x=l.querySelector('input:not([type=hidden]), select, button');x?.focus()}
function closeSheet(){const l=document.getElementById('sheetLayer');l.classList.add('hidden');l.setAttribute('aria-hidden','true')}
function openSettings(){showSheet('Ajustar base',`<form id="settingsForm" class="fields"><div class="field"><label for="asOf">Data de referência</label><input type="date" name="asOf" id="asOf" value="${state.asOf}" required><small>O laboratório utiliza a data para organizar o período de referência.</small></div><div class="field-grid"><div class="field"><label>Salário líquido estimado</label><input type="number" name="salaryNet" min="0" step="0.01" value="${state.salaryNet}" required></div><div class="field"><label>Dia do salário</label><input type="number" name="payDay" min="1" max="28" value="${state.payDay}" required></div></div><div class="field"><label>Benefício convertido (cenário)</label><input type="number" name="benefitCash" min="0" step="0.01" value="${state.benefitCash}"></div><label class="checkline"><input type="checkbox" name="benefitForecast" ${state.benefitForecast?'checked':''}> Simular conversão do benefício nas receitas futuras</label><label class="checkline"><input type="checkbox" name="includeUncertain" ${state.includeUncertain?'checked':''}> Incluir receitas extraordinárias previstas (13º/PIS)</label><label class="checkline"><input type="checkbox" name="hideMoney" ${state.hideMoney?'checked':''}> Ocultar valores na interface</label><div class="sheet-actions"><button class="primary-btn" type="submit">Salvar preferências</button><button class="outline-btn" type="button" data-action="backup">${icon('download',17)} Exportar dados</button><button class="outline-btn" type="button" data-action="import">${icon('upload',17)} Importar</button></div><button class="outline-btn danger-btn" type="button" data-action="reset" style="margin-top:10px">Restaurar dados de referência</button><input type="file" accept="application/json" id="importData" class="hidden"></form>`)}
function openBalance(){const bal=state.balance==null?'':state.balance;showSheet('Minhas contas',`<form id="balanceForm" class="fields"><div class="field"><label>Saldo disponível em conta (R$)</label><input type="number" min="0" step="0.01" name="balance" placeholder="R$ 0,00" value="${bal}" required><small>Não inclua limite do cartão, cheque especial ou valores ainda a receber.</small></div><label class="checkline"><input type="checkbox" name="reconciled" ${state.reconciled?'checked':''}> Conferi o saldo e os compromissos registrados</label><p class="helper">Uma conferência manual não substitui a conciliação bancária. O orçamento será uma estimativa prudente.</p><button class="primary-btn">Salvar saldo</button></form>`)}
function openBudget(){const d=daily();showSheet('Orçamento diário',`<div class="insight ${d.ready?'':'warn'}">${d.ready?`Estimativa de ${fmt(d.value)} por dia até ${displayDate(d.payday)}. Compromissos identificados antes do recebimento: ${fmt(d.due)}.`:'Para estimar o orçamento diário, precisamos de saldo informado, conferência dos compromissos e verba flexível.'}</div><form id="budgetForm" class="fields subsection"><div class="field"><label>Verba mensal para gastos flexíveis (R$)</label><input type="number" min="0" step="0.01" name="monthlyFlex" value="${state.monthlyFlex??''}" placeholder="Valor definido por você" required><small>Delivery, lazer, pequenas compras e outros gastos que não são despesas essenciais fixas.</small></div><div class="field"><label>Valor adicional a preservar até receber (R$)</label><input type="number" min="0" step="0.01" name="monthlyReserve" value="${state.monthlyReserve}" required></div><div class="sheet-actions"><button class="primary-btn">Atualizar orçamento</button><button class="outline-btn" type="button" data-action="open-balance">${icon('wallet',16)} Informar saldo</button></div></form>`)}
function openTransaction(kind='expense',txId=null){const t=state.transactions.find(x=>x.id===txId);const item=t||{name:'',amount:'',kind,category:kind==='income'?'Receita':kind==='transfer'?'Transferência':'Flexível',date:state.asOf,status:'confirmed',note:''};showSheet(t?'Editar movimento':'Novo movimento',`<form id="txForm" class="fields"><input type="hidden" name="txId" value="${e(t?.id||'')}"><div class="field-grid"><div class="field"><label>Movimento</label><select name="kind"><option value="expense" ${item.kind==='expense'?'selected':''}>Despesa</option><option value="income" ${item.kind==='income'?'selected':''}>Receita</option><option value="transfer" ${item.kind==='transfer'?'selected':''}>Transferência</option></select></div><div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" name="amount" required value="${item.amount}"></div></div><div class="field"><label>Descrição</label><input name="name" placeholder="Ex.: mercado, ônibus, Pix" value="${e(item.name)}" required></div><div class="field-grid"><div class="field"><label>Data</label><input type="date" name="date" value="${e(item.date)}" required></div><div class="field"><label>Categoria</label><select name="category">${['Flexível','Alimentação','Transporte','Lazer','Compras','Moradia','Educação','Saúde','Assinaturas','Receita','Transferência','Outros'].map(c=>`<option ${item.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Situação</label><select name="status"><option value="confirmed" ${item.status==='confirmed'?'selected':''}>Confirmado</option><option value="planned" ${item.status==='planned'?'selected':''}>Previsto</option></select></div><div class="field"><label>Observação (opcional)</label><input name="note" value="${e(item.note||'')}"></div><div class="sheet-actions"><button class="primary-btn">${t?'Salvar alterações':'Registrar movimento'}</button>${t?`<button type="button" class="outline-btn danger-btn" data-action="delete-tx" data-id="${e(t.id)}">${icon('trash',16)} Excluir</button>`:''}</div></form>`)}
function openNewLoan(){showSheet('Emprestei dinheiro',`<form id="loanForm" class="fields"><div class="field"><label>Para quem?</label><input name="name" placeholder="Nome da pessoa" required></div><div class="field-grid"><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Data</label><input name="date" type="date" value="${state.asOf}" required></div></div><div class="field"><label>Devolução prevista (opcional)</label><input name="due" type="date"></div><label class="checkline"><input type="checkbox" name="historic"> Valor emprestado anteriormente (não gerar nova saída de caixa)</label><p class="helper">Quando você empresta dinheiro, sua liquidez diminui e surge um valor a receber. A devolução não é receita de trabalho.</p><button class="primary-btn">Registrar empréstimo</button></form>`)}
function openRepayment(id){const list=state.people.filter(x=>x.kind==='lent'&&x.remaining>0);if(!list.length){toast('Nenhum empréstimo pendente.');return}showSheet('Registrar devolução',`<form id="repayForm" class="fields"><div class="field"><label>Quem devolveu?</label><select name="person">${list.map(x=>`<option value="${e(x.id)}" ${x.id===id?'selected':''}>${e(x.name)} · ${fmt(x.remaining)}</option>`).join('')}</select></div><div class="field-grid"><div class="field"><label>Valor recebido</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="R$"></div><div class="field"><label>Data</label><input name="date" type="date" value="${state.asOf}" required></div></div><button class="primary-btn">Confirmar devolução</button></form>`)}
function openGoal(id){const g=state.goals.find(x=>x.id===id)||{name:'',target:'',saved:0,due:''};showSheet(id?'Editar objetivo':'Novo objetivo',`<form id="goalForm" class="fields"><input name="goalId" type="hidden" value="${e(id||'')}"><div class="field"><label>Nome do objetivo</label><input name="name" value="${e(g.name)}" placeholder="Ex.: Reserva, carro, viagem" required></div><div class="field-grid"><div class="field"><label>Valor necessário</label><input name="target" type="number" min="0.01" step="0.01" value="${g.target??''}" placeholder="R$" required></div><div class="field"><label>Data-alvo</label><input type="date" name="due" value="${e(g.due||'')}"></div></div><div class="field"><label>Valor já separado</label><input name="saved" type="number" min="0" step="0.01" value="${g.saved}" required><small>Registro declaratório. O valor não será retirado automaticamente da sua conta.</small></div><div class="sheet-actions"><button class="primary-btn">Salvar objetivo</button>${id?`<button type="button" class="outline-btn danger-btn" data-action="delete-goal" data-id="${e(id)}">Excluir</button>`:''}</div></form>`)}
function openDeposit(id){const g=state.goals.find(x=>x.id===id);showSheet('Planejar aporte',`<p class="helper">Objetivo: <strong>${e(g.name)}</strong>. Nesta referência, o aporte será tratado como planejamento, não como transferência bancária realizada.</p><form id="depositForm" class="fields subsection"><input name="id" type="hidden" value="${e(id)}"><div class="field"><label>Valor planejado</label><input name="amount" type="number" min="0.01" step="0.01" required></div><button class="primary-btn">Adicionar ao plano</button></form>`)}
function openAsset(id){const a=state.assets.find(x=>x.id===id)||{name:'',kind:'Investimento',amount:''};showSheet(id?'Editar ativo':'Novo ativo',`<form id="assetForm" class="fields"><input name="assetId" type="hidden" value="${e(id||'')}"><div class="field"><label>Nome do ativo</label><input name="name" value="${e(a.name)}" placeholder="Ex.: Tesouro Selic" required></div><div class="field-grid"><div class="field"><label>Tipo</label><select name="kind">${['Investimento','Bem','Poupança','Outros'].map(k=>`<option ${a.kind===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>Valor atual (R$)</label><input name="amount" type="number" min="0" step="0.01" value="${a.amount}" required></div></div><div class="sheet-actions"><button class="primary-btn">Salvar ativo</button>${id?`<button type="button" class="outline-btn danger-btn" data-action="delete-asset" data-id="${e(id)}">Excluir</button>`:''}</div></form>`)}
function openIncome(){showSheet('Fontes de renda',`<form id="incomeForm" class="fields"><div class="field-grid"><div class="field"><label>Salário líquido estimado</label><input type="number" name="salaryNet" min="0" step="0.01" value="${state.salaryNet}" required></div><div class="field"><label>Dia de recebimento</label><input type="number" name="payDay" min="1" max="28" value="${state.payDay}" required></div></div><div class="field"><label>Conversão de benefício (hipótese)</label><input type="number" name="benefitCash" min="0" step="0.01" value="${state.benefitCash}" required></div><label class="checkline"><input type="checkbox" name="benefitForecast" ${state.benefitForecast?'checked':''}> Contar conversão de benefício nos cenários</label><label class="checkline"><input type="checkbox" name="includeUncertain" ${state.includeUncertain?'checked':''}> Contar receitas extraordinárias previstas no cenário</label><p class="small-note">Este cadastro é específico do cenário inicial; em um produto multiusuário, cada fonte teria regras próprias de recorrência e confirmação.</p><button class="primary-btn">Salvar cenário</button></form>`)}
function setSection(key){state.section=key;state.organizing=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function updateAction(btn){const act=btn.dataset.action,id=btn.dataset.id;switch(act){case 'navigate':setSection(btn.dataset.to);break;case 'open-settings':openSettings();break;case 'open-balance':openBalance();break;case 'open-budget':openBudget();break;case 'open-income':openIncome();break;case 'close-sheet':closeSheet();break;case 'transaction':openTransaction(btn.dataset.kind||'expense');break;case 'edit-transaction':openTransaction('expense',id);break;case 'new-loan':openNewLoan();break;case 'loan-repay':openRepayment(id);break;case 'module-open':state.expanded[id]=true;state.hiddenModules=state.hiddenModules.filter(x=>x!==id);save();render();document.querySelector(`[data-module="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'});break;case 'toggle-module':state.expanded[id]=!state.expanded[id];save();render();break;case 'organize':state.organizing=!state.organizing;save();render();toast(state.organizing?'Organização ativada':'Organização salva');break;case 'move-module':{const idx=state.homeOrder.indexOf(id),dir=Number(btn.dataset.dir);if(idx<0||idx+dir<0||idx+dir>=state.homeOrder.length)return;const y=state.homeOrder.splice(idx,1)[0];state.homeOrder.splice(idx+dir,0,y);save();render();break}case 'hide-module':state.hiddenModules.push(id);save();render();break;case 'show-modules':state.hiddenModules=[];save();render();break;case 'movement-filter':state.movementFilter=btn.dataset.filter;save();render();break;case 'plan-tab':state.planTab=btn.dataset.tab;setSection('plan');break;case 'goal-new':openGoal();break;case 'goal-edit':openGoal(id);break;case 'goal-deposit':openDeposit(id);break;case 'asset-new':openAsset();break;case 'asset-edit':openAsset(id);break;case 'pay-bill':if(!confirm('Confirmar que esse compromisso foi pago?'))return;state.paidBills.push(id);if(state.balance!=null){state.paidBillsAfterSnapshot=state.paidBillsAfterSnapshot||[];state.paidBillsAfterSnapshot.push(id)}save();render();toast('Compromisso marcado como pago.');break;case 'delete-tx':if(confirm('Excluir este movimento?')){state.transactions=state.transactions.filter(x=>x.id!==id);save();closeSheet();render();toast('Movimento excluído.')}break;case 'delete-goal':if(confirm('Excluir este objetivo?')){state.goals=state.goals.filter(x=>x.id!==id);save();closeSheet();render();toast('Objetivo excluído.')}break;case 'delete-asset':if(confirm('Excluir este ativo?')){state.assets=state.assets.filter(x=>x.id!==id);save();closeSheet();render();toast('Ativo excluído.')}break;case 'backup':exportBackup();break;case 'import':document.getElementById('importData')?.click();break;case 'reset':if(confirm('Restaurar todos os dados do Visual Lab V3? Seus lançamentos serão perdidos.')){state=makeSeed();save();closeSheet();render();toast('Base de referência restaurada.')}break;}}
document.addEventListener('click',evt=>{const btn=evt.target.closest('button[data-action]');if(btn)updateAction(btn);if(evt.target.id==='sheetLayer')closeSheet()});document.addEventListener('keydown',evt=>{if(evt.key==='Escape')closeSheet()});
document.addEventListener('submit',evt=>{const f=evt.target;if(!f.id)return;evt.preventDefault();const fd=new FormData(f);const num=k=>Number(fd.get(k));if(f.id==='settingsForm'||f.id==='incomeForm'){if(f.id==='settingsForm'){state.asOf=fd.get('asOf');state.hideMoney=fd.has('hideMoney')}state.salaryNet=num('salaryNet');state.payDay=num('payDay');state.benefitCash=num('benefitCash');state.benefitForecast=fd.has('benefitForecast');state.includeUncertain=fd.has('includeUncertain');toast('Preferências atualizadas.')}else if(f.id==='balanceForm'){state.balance=num('balance');state.reconciled=fd.has('reconciled');state.balanceCapturedAt=Date.now();state.transactions.forEach(t=>t.cashAfterSnapshot=false);state.paidBillsAfterSnapshot=[];toast('Saldo de referência atualizado.')}else if(f.id==='budgetForm'){state.monthlyFlex=num('monthlyFlex');state.monthlyReserve=num('monthlyReserve');toast('Orçamento atualizado.')}else if(f.id==='txForm'){const id=String(fd.get('txId'));const original=state.transactions.find(t=>t.id===id);const tx={id:id||uid(),kind:fd.get('kind'),name:String(fd.get('name')).trim(),amount:num('amount'),category:fd.get('category'),date:fd.get('date'),status:fd.get('status'),note:fd.get('note')||'',cashAfterSnapshot:false};if(tx.amount<=0){toast('Informe um valor positivo.');return}if(original){tx.cashAfterSnapshot=tx.kind!=='transfer'&&tx.status==='confirmed'&&state.balance!=null&&tx.date>=state.asOf&&(original.cashAfterSnapshot||original.status!=='confirmed');state.transactions=state.transactions.map(x=>x.id===id?tx:x)}else{tx.cashAfterSnapshot=state.balance!=null&&tx.date>=state.asOf&&tx.status==='confirmed'&&tx.kind!=='transfer';state.transactions.push(tx)}toast('Movimento registrado.')}else if(f.id==='loanForm'){const amount=num('amount'),historic=fd.has('historic'),date=fd.get('date');state.people.push({id:uid(),name:String(fd.get('name')).trim(),original:amount,remaining:amount,due:fd.get('due')||'',kind:'lent',origin:historic?'historic':'new'});if(!historic)state.transactions.push({id:uid(),kind:'lend',name:'Empréstimo concedido · '+fd.get('name'),amount,category:'Empréstimos entre pessoas',date,status:'confirmed',cashAfterSnapshot:state.balance!=null&&date>=state.asOf});toast('Empréstimo registrado.')}else if(f.id==='repayForm'){const p=state.people.find(x=>x.id===fd.get('person')),amount=num('amount'),date=fd.get('date');if(!p||amount<=0||amount>p.remaining+0.001){toast('Valor maior que o saldo pendente.');return}p.remaining=Math.max(0,Math.round((p.remaining-amount)*100)/100);state.transactions.push({id:uid(),kind:'repayment',name:'Devolução · '+p.name,amount,date,category:'Devolução de empréstimo',status:'confirmed',cashAfterSnapshot:state.balance!=null&&date>=state.asOf});toast('Devolução registrada.')}else if(f.id==='goalForm'){const id=fd.get('goalId'),g={id:id||uid(),name:String(fd.get('name')).trim(),target:num('target'),saved:num('saved'),due:fd.get('due')||''};if(id)state.goals=state.goals.map(x=>x.id===id?g:x);else state.goals.push(g);toast('Objetivo salvo.')}else if(f.id==='depositForm'){toast('Aporte previsto. Vinculação bancária não implementada neste laboratório.');closeSheet();return}else if(f.id==='assetForm'){const id=fd.get('assetId'),a={id:id||uid(),name:String(fd.get('name')).trim(),kind:fd.get('kind'),amount:num('amount')};if(id)state.assets=state.assets.map(x=>x.id===id?a:x);else state.assets.push(a);toast('Ativo salvo.')}else if(f.id==='simulationForm'){state.sim={name:String(fd.get('name')),price:num('price'),parts:num('parts'),start:fd.get('start')};toast('Simulação calculada.')}save();closeSheet();render()});
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Meu Gestor Financeiro',version:3,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='meu-gestor-visual-lab-v3-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Backup gerado.')}document.addEventListener('change',evt=>{if(evt.target.id==='importData'){const file=evt.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.version!==3||!Array.isArray(obj.data?.recurring)||!Array.isArray(obj.data?.bills))throw Error('Incompatível');if(!confirm('Substituir todos os dados atuais por este backup?'))return;state={...makeSeed(),...obj.data,organizing:false};save();closeSheet();render();toast('Backup importado.')}catch{toast('Arquivo incompatível com V3.')}};reader.readAsText(file)}});
let dragId=null;function attachDrag(){document.querySelectorAll('.module-card[draggable="true"]').forEach(el=>{el.addEventListener('dragstart',ev=>{dragId=el.dataset.module;el.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragId)});el.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.module-card').forEach(x=>x.classList.remove('dragging','over'))});el.addEventListener('dragover',ev=>{ev.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',ev=>{ev.preventDefault();const target=el.dataset.module;if(!dragId||dragId===target)return;state.homeOrder=state.homeOrder.filter(x=>x!==dragId);state.homeOrder.splice(state.homeOrder.indexOf(target),0,dragId);save();render()})})}
render();
</script>
</body></html>
