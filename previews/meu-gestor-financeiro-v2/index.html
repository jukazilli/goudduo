function cardBox(title,body,id='',extra=''){return `<article class="card ${id?'toggle':''}" id="${id}"><div class="card-head" ${id?`onclick="toggleCard('${id}')"`:''}><h2>${title}</h2>${id?'<span class="chev">⌄</span>':extra}</div>${body}</article>`}function toggleCard(id){document.getElementById(id)?.classList.toggle('expanded')}
function home(){const dec=totals('2026-12'),jan=totals('2027-01'),v=available(),notRecorded=unknownAmount();const future=keys.slice(1).reduce((s,k)=>s+totals(k).income-totals(k).expense,0);const next=[...data.tx].filter(t=>t.type==='expense'&&t.status!=='paid'&&t.date>='2026-11-13'&&t.date<='2027-01-31').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);const more=monthTx('2026-12').filter(t=>t.type==='expense').sort((a,b)=>a.date.localeCompare(b.date));return `${header('Seu dinheiro, com destino.','A previsão ajuda a planejar. As despesas reais mostram o que você poderá construir.','<button class="primary hide-phone" onclick="openTransaction()">+ Lançamento</button>')}<div class="dashboard-grid"><article class="card hero"><div class="row"><span class="eyebrow" style="color:#b5c0cb">DISPONÍVEL PARA GASTAR</span><span class="status">${v==null?'Saldo não informado':v<0?'Atenção aos vencimentos':'Conferir compromissos'}</span></div><div class="big nums">${v==null?'—':fmt(v)}</div><div class="muted">${v==null?'Informe seu saldo atual para calcular com compromissos conhecidos.':'Saldo informado menos obrigações previstas até 20/dez; não inclui receitas futuras.'}</div><div class="lower"><small>${v==null?'Não é possível calcular sem caixa inicial.':'Esse valor pode mudar com novos gastos.'}</small><button onclick="openBalance()">${v==null?'Informar saldo':'Atualizar saldo'} ↗</button></div></article><article class="card"><div class="card-head"><h2>Dezembro em foco</h2><span class="tag amber">Projeção</span></div><div class="metric nums">${fmt(dec.expense)}</div><div class="metric-sub">Compromissos conhecidos</div><div class="separator"></div><div class="row"><span class="muted">Entradas previstas</span><strong>${fmt(dec.income)}</strong></div><div class="row" style="margin-top:9px"><span class="muted">Saldo mensal projetado</span><strong class="${dec.income-dec.expense>=0?'green-text':'red-text'}">${fmt(dec.income-dec.expense)}</strong></div><div class="info" style="margin-top:16px">Não considera saldo anterior, gastos ocultos nem valores não cadastrados.</div></article><article class="card toggle" id="unseen"><div class="card-head" onclick="toggleCard('unseen')"><h2>Para onde está indo?</h2><span class="chev">⌄</span></div><div class="row"><div><div class="metric">${notRecorded?'Não sabemos ainda':fmt(data.variableMonthly)}</div><div class="metric-sub">${notRecorded?'Gastos variáveis não medidos':'Estimativa mensal de gastos variáveis'}</div></div><span class="tag ${notRecorded?'amber':'blue'}">${notRecorded?'Dados incompletos':'Estimativa'}</span></div><div class="separator"></div><div class="row"><span>Gastos extras lançados em dezembro</span><strong>${fmt(getActual('2026-12'))}</strong></div><div class="collapse"><p class="subline">Pix, mercado, delivery, transporte e compras fora da base devem entrar aqui. Não presuma que despesas ausentes sejam zero.</p><div class="actions"><button class="secondary" onclick="openVariable()">Estimar gastos reais</button><button class="secondary" onclick="openTransaction('expense')">Adicionar despesa</button></div></div></article><article class="card toggle" id="dues"><div class="card-head" onclick="toggleCard('dues')"><h2>Próximos compromissos</h2><span class="chev">⌄</span></div>${next.map(t=>`<div class="listrow"><div><div class="label">${esc(t.name)}</div><small>${t.date.split('-').reverse().join('/')} · ${esc(t.account)}</small></div><strong class="nums">${fmt(t.amount)}</strong></div>`).join('')||'<div class="empty">Nenhum vencimento identificado</div>'}<div class="collapse"><button class="textbtn" onclick="showSection('transactions')">Todos os lançamentos ↗</button></div></article><article class="card toggle span-all" id="trajectory"><div class="card-head" onclick="toggleCard('trajectory')"><h2>Previsão e realidade</h2><span class="chev">⌄</span></div><div class="row"><div><div class="metric nums">${fmt(future)}</div><div class="metric-sub">Soma de saldos mensais projetados · dez/26 a dez/27</div></div><span class="tag amber">Não é patrimônio</span></div><div class="chart">${keys.slice(1).map((k,i)=>{const t=totals(k);const max=5600;return `<div class="cmonth" title="${months[i+1]} • entrada ${fmt(t.income)} • saída ${fmt(t.expense)}"><div class="bars"><div class="bar" style="height:${Math.max(2,t.expense/max*100)}%;background:#b4c0cc"></div><div class="bar" style="height:${Math.max(2,t.income/max*100)}%;background:#2e66d6"></div></div><small>${months[i+1].split('/')[0]}</small></div>`}).join('')}</div><div class="legend"><span><i style="background:#2e66d6"></i>Entradas previstas</span><span><i style="background:#b4c0cc"></i>Saídas cadastradas</span></div><div class="collapse"><div class="separator"></div><p class="subline">O resultado anual depende de todas as despesas terem sido lançadas e das receitas incertas se concretizarem. Ausência de transação não é economia.</p><button class="secondary" onclick="showSection('flow')">Analisar por mês</button></div></article><article class="card toggle" id="spending"><div class="card-head" onclick="toggleCard('spending')"><h2>Despesas de dezembro</h2><span class="chev">⌄</span></div>${groupByCategory('2026-12').slice(0,5).map(([c,n])=>`<div class="catbar"><span>${esc(c)}</span><div class="meter"><i style="width:${Math.max(2,Math.min(100,n/dec.expense*100))}%"></i></div><strong>${fmt(n)}</strong></div>`).join('')}<div class="collapse"><div class="separator"></div><button class="textbtn" onclick="showSection('transactions')">Explorar lançamentos ↗</button></div></article><article class="card"><div class="card-head"><h2>Seu próximo objetivo</h2><span class="tag blue">Patrimônio</span></div>${data.goals[0]?`<div class="row"><strong>${esc(data.goals[0].name)}</strong><span class="muted">${Math.min(100,Math.round(data.goals[0].saved/data.goals[0].target*100))}%</span></div><div class="meter"><i style="width:${Math.min(100,100*data.goals[0].saved/data.goals[0].target)}%;background:#1e9f85"></i></div><div class="row"><small>${fmt(data.goals[0].saved)} guardados</small><small>${fmt(data.goals[0].target)} de meta</small></div>`:'<p class="muted">Nenhuma meta cadastrada</p>'}<div class="actions" style="margin-top:18px"><button class="secondary" onclick="showSection('goals')">Ver objetivos ↗</button><button class="secondary" onclick="showSection('simulate')">Simular compra ↗</button></div></article></div>`}
function groupByCategory(k){const m={};monthTx(k).filter(t=>t.type==='expense').forEach(t=>m[t.category]=(m[t.category]||0)+Number(t.amount));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function flow(){const total=keys.slice(1).reduce((s,k)=>{const t=totals(k);return{sIn:s.sIn+t.income,sOut:s.sOut+t.expense}},{sIn:0,sOut:0});const variable=Number(data.variableMonthly||0);return `${header('Fluxo de caixa.','O saldo mensal projetado não substitui o dinheiro disponível na conta.')}<div class="notice">Previsão ≠ saldo bancário. ${unknownAmount()?'Gastos variáveis ainda não medidos.':'Incluindo uma estimativa de gastos variáveis.'} Valores de 2027 dependem de confirmação e atualização.</div><div class="two" style="margin-bottom:14px">${cardBox('Entradas previstas',`<div class="metric">${fmt(total.sIn)}</div><small>Dez/26 a Dez/27</small>`)}${cardBox('Despesas cadastradas',`<div class="metric">${fmt(total.sOut)}</div><small>Antes de despesas não registradas</small>`)}</div><article class="card"><div class="card-head"><h2>Meses</h2><button class="tinybtn" onclick="openVariable()">${unknownAmount()?'Informar gastos variáveis':'Editar estimativa'}</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Mês</th><th>Entradas</th><th>Compromissos</th><th>Variáveis estimadas</th><th>Resultado</th></tr></thead><tbody>${keys.slice(1).map((k,i)=>{const t=totals(k);const net=t.income-t.expense-Math.max(0,variable-getActual(k));return `<tr><td><strong>${months[i+1]}</strong></td><td>${fmt(t.income)}</td><td>${fmt(t.expense)}</td><td>${unknownAmount()?'Não medido':fmt(variable)}</td><td><strong class="${net>=0?'green-text':'red-text'}">${fmt(net)}</strong></td></tr>`}).join('')}</tbody></table></div></article><div class="two" style="margin-top:14px">${cardBox('Leitura por categorias',groupByCategory(filterMonth()).map(([c,n])=>`<div class="listrow"><span>${esc(c)}</span><strong>${fmt(n)}</strong></div>`).join('')+`<div class="separator"></div><button class="textbtn" onclick="openMonth()">Escolher mês ↗</button>`)}${cardBox('O que muda a projeção',`<p class="muted">Retirar receitas incertas torna a análise mais conservadora. A estimativa de gastos variáveis reduz o resultado mensal.</p><div class="separator"></div><div class="row"><span>Contar PIS e 13º estimados</span><input aria-label="Contar receitas incertas" type="checkbox" ${data.uncertain?'checked':''} onchange="data.uncertain=this.checked;save();render()" style="width:21px;height:21px;accent-color:var(--blue)"></div><div class="separator"></div><p class="info">Para calcular caixa diário, cadastre saldo atual e datas reais de pagamentos.</p>`)}</div>`}
function transactions(){let k=filterMonth(),arr=monthTx(k).sort((a,b)=>a.date.localeCompare(b.date));return `${header('Lançamentos.','Registre o que aconteceu. Revise o previsto. Separe consumo de pagamento de dívidas.','<button class="primary" onclick="openTransaction()">+ Novo</button>')}<article class="card"><div class="row" style="margin-bottom:15px"><div class="field"><label>Mês</label><select onchange="data.month=this.value;save();render()">${keys.map((x,i)=>`<option value="${x}" ${x===k?'selected':''}>${months[i]}</option>`).join('')}</select></div><span class="tag amber">${arr.length} lançamentos</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Status</th><th>Valor</th></tr></thead><tbody>${arr.map(t=>`<tr><td>${t.date.slice(-2)}/${t.date.slice(5,7)}</td><td><strong>${esc(t.name)}</strong><br><small>${esc(t.account)} ${t.uncertain?'· incerto':''}</small></td><td>${esc(t.category)}</td><td><span class="tag ${t.status==='paid'?'green':'amber'}">${t.status==='paid'?'Confirmado':'Previsto'}</span></td><td><button class="textbtn ${t.type==='expense'?'red-text':'green-text'}" onclick="openTransaction(null,${t.id})">${t.type==='expense'?'-':'+'}${fmt(t.amount)} ↗</button></td></tr>`).join('')}</tbody></table></div></article><p class="info" style="margin-top:15px">Os compromissos importados da base são agregados. O detalhamento individual de cada fatura será evoluído com conciliação por instituição.</p>`}
function cards(){const rows=[['Shopee','SParcelado e empréstimos','2027-11',4275.89],['PicPay','Lançamentos futuros','2027-04',596.45],['DM Visa / Koch','Dois parcelamentos; atribuição pendente','2027-11',2585.5],['Caixa','Fatura dez/26 (aberta)','2026-12',763.05],['Mercado Pago','Resumo de empréstimos; não conciliado','2027-09',166.05]];return `${header('Cartões e dívidas.','Quanto ainda precisa ser pago e onde existem informações a conciliar.')}<div class="notice">Valores da base são pagamentos futuros identificados, não saldo devedor para liquidação. O resumo do Mercado Pago está fora dos totais por falta de reconciliação.</div><div class="cardlist">${rows.map(r=>`<div class="institution"><strong>${esc(r[0])}</strong><small>${esc(r[1])}</small><div class="amount">${fmt(r[3])}</div><small>Última referência: ${r[2].split('-').reverse().join('/')}</small><div class="separator"></div><span class="tag ${r[0]==='Shopee'||r[0]==='PicPay'?'blue':'amber'}">${r[0]==='Shopee'||r[0]==='PicPay'?'Base identificada':'Exige conciliação'}</span></div>`).join('')}</div><article class="card" style="margin-top:14px"><div class="card-head"><h2>Compromissos previstos por instituição</h2><span class="tag blue">2027</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Instituição</th>${keys.slice(2).map(k=>`<th>${k.slice(5)}</th>`).join('')}</tr></thead><tbody>${Object.entries(baseDebt2027).map(([name,a])=>`<tr><td><strong>${esc(name)}</strong></td>${a.map(n=>`<td>${n?fmtD(n):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="info">Caixa e Mercado Pago ainda não possuem cronograma futuro completo. O PicPay consta uma vez, sem duplicar os R$ 596,45.</p></article>`}
function goals(){return `${header('Objetivos e patrimônio.','Separar dinheiro para o futuro transforma metas em escolhas financiáveis.','<button class="primary" onclick="openGoal()">+ Meta</button>')}<div class="three">${data.goals.map(g=>`<article class="card"><div class="card-head"><h2>${esc(g.name)}</h2><button class="tinybtn" onclick="openGoal(${g.id})">Editar</button></div><div class="metric">${fmt(g.saved)}</div><small>de ${fmt(g.target)} · até ${g.date.split('-').reverse().join('/')}</small><div class="meter"><i style="width:${Math.min(100,100*g.saved/g.target)}%;background:#159b83"></i></div><div class="row"><small>${Math.round(100*g.saved/g.target)}% alcançado</small><button class="textbtn" onclick="addToGoal(${g.id})">+ Aporte</button></div></article>`).join('')}</div><div class="two" style="margin-top:14px">${cardBox('Patrimônio registrado',`<div class="metric">${fmt(data.assets.reduce((s,a)=>s+Number(a.amount),0))}</div><p class="subline">Saldo em investimentos registrado manualmente. Não confundir aporte com rendimento.</p><button class="secondary" onclick="openAsset()">+ Investimento ou ativo</button>${data.assets.map(a=>`<div class="listrow"><span>${esc(a.name)}</span><strong>${fmt(a.amount)}</strong></div>`).join('')}`)}${cardBox('Etapas da reserva',`<div class="listrow"><span>Primeiro colchão financeiro</span><strong>R$ 1.000</strong></div><div class="listrow"><span>Uma mensalidade de despesas fixas</span><strong>R$ 1.131</strong></div><div class="listrow"><span>Três meses de despesas fixas</span><strong>R$ 3.393</strong></div><small>Referências mínimas demonstrativas. A reserva adequada deve incluir seu gasto essencial real e dívidas que continuariam vencendo.</small>`)}</div>`}
function simulate(){const sim=data.simulation;const base=totals('2027-01');return `${header('Antes de comprar.','O limite aprovado pelo banco não é o quanto cabe no seu orçamento.')}<div class="two"><article class="card"><div class="card-head"><h2>Simular compra</h2><span class="tag blue">Sem contratar crédito</span></div><form class="stack" onsubmit="runSimulation(event)"><div class="field"><label>Compra</label><input name="name" placeholder="Ex.: viagem para o casamento" required value="${esc(sim?.name||'')}"></div><div class="two"><div class="field"><label>Valor total (R$)</label><input name="price" type="number" min="0" step="0.01" required value="${sim?.price||''}"></div><div class="field"><label>Parcelas</label><select name="parts">${[1,2,3,4,5,6,8,10,12,18,24].map(n=>`<option ${Number(sim?.parts||1)===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label>Primeira parcela</label><select name="start">${keys.slice(1).map((k,i)=>`<option value="${k}" ${sim?.start===k?'selected':''}>${months[i+1]}</option>`).join('')}</select></div><button class="primary" type="submit">Calcular impacto</button></form></article><article class="card"><div class="card-head"><h2>Impacto da decisão</h2><span class="tag amber">Simulação</span></div>${sim?simulationResult(sim):`<div class="empty" style="padding:50px 18px">Preencha uma compra para comparar com seus compromissos futuros.</div>`}</article></div>`}
function simulationResult(s){const installment=Number(s.price)/Number(s.parts);const start=keys.indexOf(s.start);const affected=keys.slice(start,start+Number(s.parts));const rows=affected.map(k=>{const t=totals(k);return {k,net:t.income-t.expense-Math.max(0,Number(data.variableMonthly||0)-getActual(k))-installment}});return `<div class="metric">${fmt(installment)}<span style="font-size:13px;color:var(--soft);font-weight:500"> / parcela</span></div><div class="metric-sub">${s.parts}x · Total ${fmt(s.price)}</div><div class="separator"></div><div class="row"><span>Meses com saldo negativo</span><strong class="${rows.some(r=>r.net<0)?'red-text':'green-text'}">${rows.filter(r=>r.net<0).length}</strong></div><div class="separator"></div>${rows.map(r=>`<div class="listrow"><span>${esc(r.k)}</span><strong class="${r.net>=0?'green-text':'red-text'}">${fmt(r.net)}</strong></div>`).join('')}<p class="info" style="margin-top:12px">Considera só compromissos cadastrados; sem gastos ocultos, pode superestimar a capacidade real.</p><div class="actions" style="margin-top:12px"><button class="secondary" onclick="createSimulationExpense()">Adicionar ao planejamento</button><button class="ghost" onclick="data.simulation=null;save();render()">Limpar</button></div>`}
function settings(){return `${header('Ajustar base.','Revise hipóteses antes de tomar decisões sobre seu dinheiro.')}<div class="two"><article class="card"><div class="stack"><div class="field"><label>Saldo disponível hoje (R$)</label><input id="balanceValue" type="number" min="0" step="0.01" placeholder="Não informado" value="${data.balance??''}"></div><div class="field"><label>Gastos variáveis estimados por mês (R$)</label><input id="variableValue" type="number" min="0" step="0.01" placeholder="Ainda não medido" value="${data.variableMonthly??''}"></div><div class="row"><span>Contar receitas incertas nas projeções</span><input id="uncertainValue" type="checkbox" ${data.uncertain?'checked':''} style="width:20px;height:20px"></div><button class="primary" onclick="saveSettings()">Salvar alterações</button></div></article>${cardBox('Seus dados',`<p class="subline">O protótipo armazena lançamentos e metas apenas neste navegador.</p><div class="actions"><button class="secondary" onclick="exportData()">Exportar JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">Importar JSON</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></div><div class="separator"></div><button class="textbtn dangerbtn" onclick="resetData()">Restaurar dados iniciais</button>` )}</div>`}
function saveSettings(){const b=document.getElementById('balanceValue').value,v=document.getElementById('variableValue').value;data.balance=b===''?null:Number(b);data.variableMonthly=v===''?null:Number(v);data.uncertain=document.getElementById('uncertainValue').checked;save();render()}
function openBalance(){openModal(`<header><h2>Saldo disponível</h2><button class="ghost" onclick="closeModal()">✕</button></header><form class="stack" onsubmit="event.preventDefault();data.balance=this.amount.value===''?null:Number(this.amount.value);save();closeModal();render()"><div class="field"><label>Saldo total em contas (R$)</label><input name="amount" type="number" step="0.01" min="0" value="${data.balance??''}" placeholder="Não informado"></div><p class="info">É o dinheiro que você efetivamente possui. Não inclua limite de cartão ou cheque especial.</p><button class="primary">Salvar saldo</button></form>`)}
function openVariable(){openModal(`<header><h2>Gastos que não aparecem</h2><button class="ghost" onclick="closeModal()">✕</button></header><form class="stack" onsubmit="event.preventDefault();data.variableMonthly=this.amount.value===''?null:Number(this.amount.value);save();closeModal();render()"><p class="subline">Se você ainda não sabe, deixe em branco. Esta estimativa não substitui o registro de despesas reais.</p><div class="field"><label>Estimativa mensal adicional (R$)</label><input name="amount" type="number" min="0" step="0.01" placeholder="Ex.: 600" value="${data.variableMonthly??''}"></div><button class="primary">Atualizar projeção</button></form>`)}
function openMonth(){openModal(`<header><h2>Escolher mês</h2><button class="ghost" onclick="closeModal()">✕</button></header><div class="field"><select onchange="data.month=this.value;save();closeModal();render()">${keys.map((x,i)=>`<option ${data.month===x?'selected':''} value="${x}">${months[i]}</option>`).join('')}</select></div>`)}
function openTransaction(type=null,id=null){const t=id?data.tx.find(x=>x.id===id):null;const d=t||{date:'2026-12-13',name:'',type:type||'expense',category:'Outros',account:'Conta corrente',amount:'',status:'planned',uncertain:false};openModal(`<header><h2>${t?'Editar lançamento':'Novo lançamento'}</h2><button class="ghost" onclick="closeModal()">✕</button></header><form id="transactionForm" class="stack" onsubmit="submitTransaction(event,${id??'null'})"><div class="two"><div class="field"><label>Tipo</label><select name="type"><option value="expense" ${d.type==='expense'?'selected':''}>Saída</option><option value="income" ${d.type==='income'?'selected':''}>Entrada</option></select></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${d.amount}"></div></div><div class="field"><label>Descrição</label><input name="name" required value="${esc(d.name)}" placeholder="Ex.: almoço, combustível, Pix"></div><div class="two"><div class="field"><label>Data</label><input name="date" type="date" required value="${d.date}"></div><div class="field"><label>Categoria</label><select name="category">${['Alimentação','Transporte','Lazer','Compras','Saúde','Moradia','Educação','Assinaturas','Dívidas','Salário','Benefício','Extra','Outros'].map(c=>`<option ${c===d.category?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Conta / instituição</label><input name="account" value="${esc(d.account)}"></div><div class="field"><label>Status</label><select name="status"><option value="planned" ${d.status==='planned'?'selected':''}>Previsto</option><option value="paid" ${d.status==='paid'?'selected':''}>Confirmado / pago</option></select></div><label style="font-size:13px"><input name="uncertain" type="checkbox" ${d.uncertain?'checked':''}> Receita incerta (não considerar no cenário conservador)</label><div class="actions"><button class="primary" type="submit">${t?'Salvar':'Adicionar'}</button>${t?`<button class="secondary dangerbtn" type="button" onclick="deleteTransaction(${id})">Excluir</button>`:''}</div></form><p class="scrim-note">Pagamentos de cartão já incluídos na base não devem ser lançados em duplicidade como despesa.</p>`)}
function submitTransaction(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id??data.lastId++,date:f.get('date'),name:String(f.get('name')).trim(),amount:Number(f.get('amount')),type:f.get('type'),category:f.get('category'),account:String(f.get('account')),status:f.get('status'),uncertain:!!f.get('uncertain'),origin:id?data.tx.find(t=>t.id===id)?.origin||'manual':'manual'};if(id)data.tx=data.tx.map(t=>t.id===id?o:t);else data.tx.push(o);data.month=getMonth(o.date);save();closeModal();render()}function deleteTransaction(id){if(!confirm('Excluir este lançamento?'))return;data.tx=data.tx.filter(t=>t.id!==id);save();closeModal();render()}
function openGoal(id=null){const g=data.goals.find(x=>x.id===id)||{name:'',target:'',saved:0,date:'2027-12-31'};openModal(`<header><h2>${id?'Editar objetivo':'Novo objetivo'}</h2><button class="ghost" onclick="closeModal()">✕</button></header><form class="stack" onsubmit="submitGoal(event,${id??'null'})"><div class="field"><label>Objetivo</label><input name="name" required value="${esc(g.name)}"></div><div class="two"><div class="field"><label>Meta (R$)</label><input name="target" type="number" min="1" required step="0.01" value="${g.target}"></div><div class="field"><label>Guardado (R$)</label><input name="saved" type="number" min="0" required step="0.01" value="${g.saved}"></div></div><div class="field"><label>Data-alvo</label><input name="date" type="date" required value="${g.date}"></div><div class="actions"><button class="primary">Salvar objetivo</button>${id?`<button class="secondary dangerbtn" type="button" onclick="deleteGoal(${id})">Excluir</button>`:''}</div></form>`)}function submitGoal(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id??Date.now(),name:String(f.get('name')),target:Number(f.get('target')),saved:Number(f.get('saved')),date:String(f.get('date'))};if(id)data.goals=data.goals.map(g=>g.id===id?o:g);else data.goals.push(o);save();closeModal();render()}function deleteGoal(id){if(!confirm('Excluir este objetivo?'))return;data.goals=data.goals.filter(g=>g.id!==id);save();closeModal();render()}function addToGoal(id){const g=data.goals.find(x=>x.id===id);const a=prompt('Quanto deseja adicionar ao objetivo (R$)?');if(a===null)return;const v=moneyInput(a);if(v>0){g.saved+=v;save();render()}}
function openAsset(){openModal(`<header><h2>Novo ativo</h2><button class="ghost" onclick="closeModal()">✕</button></header><form class="stack" onsubmit="event.preventDefault();const f=new FormData(this);data.assets.push({id:Date.now(),name:String(f.get('name')),amount:Number(f.get('amount'))});save();closeModal();render()"><div class="field"><label>Ativo / investimento</label><input name="name" required placeholder="Ex.: Tesouro Selic"></div><div class="field"><label>Saldo atual (R$)</label><input name="amount" type="number" min="0" step="0.01" required></div><button class="primary">Adicionar</button></form>`)}
function runSimulation(e){e.preventDefault();const f=new FormData(e.target);data.simulation={name:String(f.get('name')),price:Number(f.get('price')),parts:Number(f.get('parts')),start:String(f.get('start'))};save();render()}function createSimulationExpense(){const s=data.simulation;if(!s)return;const start=keys.indexOf(s.start);for(let i=0;i<s.parts;i++){const k=keys[start+i];if(!k)break;data.tx.push({id:data.lastId++,date:k+'-20',name:s.name+' · '+(i+1)+'/'+s.parts,amount:Number(s.price)/s.parts,type:'expense',category:'Compras',account:'Simulação convertida em plano',status:'planned',origin:'manual'})}data.simulation=null;save();showSection('transactions')}
function exportData(){const blob=new Blob([JSON.stringify({app:'Meu Gestor Financeiro',version:2,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-gestor-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data?.tx||!Array.isArray(j.data.goals))throw Error('Arquivo inválido');if(!confirm('Substituir os dados atuais pelo backup?'))return;data={...initial(),...j.data};save();render()}catch(err){alert('Backup incompatível.')}};r.readAsText(file)}function resetData(){if(!confirm('Restaurar valores iniciais? Seus lançamentos locais serão perdidos.'))return;data=initial();save();render()}function render(){navRender();const views={home,flow,transactions,cards,goals,simulate,settings};document.getElementById('pageContent').innerHTML=(views[data.section]||home)()}render();
