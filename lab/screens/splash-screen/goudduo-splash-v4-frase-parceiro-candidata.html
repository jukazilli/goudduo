<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>goudduo — Splash V4 — frase-manifesto atual</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111315;
      --ink-soft: #3b4146;
      --line: #d5dce2;
      --line-strong: #bcc5cc;
      --shell: #e8edf1;
      --shadow: 0 24px 56px rgba(16, 32, 43, 0.12);
      --radius: 54px;
      --phone-w: 390px;
      --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background: var(--shell); color: var(--ink); }
    body { font-family: "Plus Jakarta Sans", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .frame { display:grid; gap:18px; justify-items:center; }
    .phone {
      width:min(100%, var(--phone-w));
      aspect-ratio: 390 / 844;
      background: var(--bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      border: 1px solid rgba(16,32,43,0.06);
      isolation:isolate;
    }
    .status {
      position:absolute; inset:0 0 auto 0; padding:34px 26px 0 26px;
      display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:20px; letter-spacing:-0.02em;
      color: rgba(255,255,255,0.0); /* hidden by default */
      pointer-events:none;
    }
    .screen {
      position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding: clamp(28px, 8vw, 48px);
      text-align:center; background:#fff;
    }
    .lockup { width:min(100%, 272px); transform: translateY(-22px); display:flex; flex-direction:column; align-items:center; }
    .logo { width:100%; height:auto; display:block; margin:0 auto; }
    .ornament { display:flex; align-items:center; gap:12px; margin:34px 0 14px; opacity:0.9; }
    .ornament span { display:block; width:44px; height:1px; background: linear-gradient(90deg, transparent, var(--line-strong)); }
    .ornament span:last-child { transform:scaleX(-1); }
    .ornament i { width:8px; height:8px; border:1px solid var(--line-strong); transform:rotate(45deg); display:block; }
    .manifesto { margin:0; color:var(--ink-soft); font-size:24px; line-height:1.28; letter-spacing:-0.03em; font-weight:500; }
    .manifesto .light { display:block; font-weight:500; }
    .manifesto .strong { display:block; color:var(--ink); font-weight:800; font-size:1.08em; margin-top:2px; }
    .note { color:#65727e; font-size:12px; line-height:1.45; max-width:420px; text-align:center; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .controls button { border:1px solid #d7dee4; background:#fff; color:#1c242b; border-radius:999px; padding:10px 14px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(16,32,43,0.06); }
    .controls button[aria-pressed="true"] { background:#111315; color:#fff; border-color:#111315; }
    .fade-in { animation: splashIn 560ms cubic-bezier(.22,.84,.24,1) both; }
    @keyframes splashIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .fade-in { animation:none; } }
  </style>
</head>
<body>

  <script>
    const phone = document.getElementById('phone');
    const buttons = [...document.querySelectorAll('[data-w]')];
    buttons.forEach((btn) => btn.addEventListener('click', () => {
      buttons.forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      const w = Number(btn.dataset.w), h = Number(btn.dataset.h);
      phone.style.width = `min(100%, ${w}px)`;
      phone.style.aspectRatio = `${w} / ${h}`;
    }));
  </script>
