function preview(r){const dayIndex=(s.daysByRoutine&&s.daysByRoutine[r.id])??0;const w=work(r,dayIndex);const tags=w?[...new Set(w.exercises.map(e=>e.muscle))].join(' · '):'';return `<div class="gd-expand-shell" ${s.expandedId===r.id?'':'inert'} aria-hidden="${s.expandedId!==r.id}"><div class="gd-bento-preview"><div class="gd-bento-week gd-v7-week" role="tablist" aria-label="Semana de ${E(r.name)}">${days.map((d,i)=>`<button role="tab" aria-selected="${dayIndex===i}" class="${dayIndex===i?'chosen':''} ${r.workouts[i]?'is-planned':''}" data-action="inline-day" data-id="${E(r.id)}" data-day="${i}" aria-label="${E(d)}${r.workouts[i]?', com treino':', dia livre'}">${E(d)}<i></i></button>`).join('')}</div><div class="gd-v7-workout"><span class="gd-v7-overline">${E(days[dayIndex]).toUpperCase()} · ${w?w.exercises.length+' EXERCÍCIOS':'DIA LIVRE'}</span><h3>${w?E(w.title):'Sem treino'}</h3>${tags?`<p class="gd-v7-muscles">${E(tags)}</p>`:''}${w?`<div class="gd-v7-exercises">${w.exercises.slice(0,2).map(e=>`<span>${E(e.name)}</span>`).join('')}${w.exercises.length>2?`<small>+ ${w.exercises.length-2} exercício${w.exercises.length-2>1?'s':''}</small>`:''}</div>`:'<p class="gd-v7-muscles">Você pode adicionar um treino a este dia.</p>'}<button class="gd-v7-cta" data-action="workout-from-card" data-id="${E(r.id)}" data-day="${dayIndex}">${w?'Ver treino':'Adicionar treino'}</button></div></div></div>`}

a.</p>`}else if(sh.type==='share'){html=`<h3>Compartilhar rotina</h3><p class="gd-sheet-desc">Prévia demonstrativa de compartilhamento.</p>${row('check','Concluir','close-sheet')}`}else if(sh.type==='delete'){html=`<h3>Excluir rotina?</h3><p class="gd-sheet-desc">Essa ação remove a rotina apenas desta demonstração.</p>${row('trash','Excluir rotina','confirm-delete',sh.id,true)}`;}else if(sh.type==='exercise'){html=`<h3>Exercício</h3>${row('swap','Reordenar','reorder')}${row('trash','Excluir exercício','delete-exercise',null,true)}`;}else if(sh.type==='reorder'){html=`<h3>Reordenar exercício</h3>${row('up','Mover para cima','move-up')}${row('down','Mover para baixo','move-down')}`;}else if(sh.type==='substitutes'){const e=s.workoutDraft?.exercises[s.activeEx];html=`<h3>Adicionar substituição</h3><p class="gd-sheet-desc">Escolha uma alternativa para ${E(e?.name)}.</p>${catalog.filter(c=>c.name!==e?.name).slice(0,6).map(c=>`<button class="gd-sheet-row" data-action="pick-substitute" data-name="${E(c.name)}"><span>${E(c.name)}<small style="display:block;color:#8b98a1;margin-top:3px">${E(c.equipment)}</small></span>${I('plus',16)}</button>`).join('')}`;}else if(sh.type==='equipment'){html=`<h3>Equipamento</h3>${[...new Set(catalog.map(c=>c.equipment))].map(c=>`<button class="gd-sheet-row" data-action="pick-equipment" data-name="${E(c)}"><span>${E(c)}</span></button>`).join('')}`;}else if(sh.type==='workout'){html=`<h3>Treino</h3>${row('edit','Editar treino','edit-workout')}${row('swap','Mover para outro dia','move-workout')}`;}else if(sh.type==='move-workout'){html=`<h3>Mover treino para</h3>${days.map((d,i)=>`<button class="gd-sheet-row" data-action="pick-move-day" data-day="${i}"><span>${d}</span></button>`).join('')}`;}return `<div class="gd-sheet-backdrop" data-action="close-sheet"><div class="gd-sheet" role="${sh.type==='single-exercise-confirm'?'alertdialog':'dialog'}" aria-modal="true" ${sh.type==='single-exercise-confirm'?'aria-label="Confirmação de treino com um function render(){const oldPage=root.dataset.page;const pos=root.querySelector('.gd-content')?.scrollTop||0;root.innerHTML=`<div class="gd-wrapper"><div class="gd-scene"><span class="gd-scene-label">TESTAR ESTADO</span>${[['multi','Várias rotinas'],['one','Uma rotina'],['empty','Sem rotinas']].map(([k,n])=>`<button class="gd-chip-demo ${s.scenario===k?'active':''}" data-action="scene" data-value="${k}">${n}</button>`).join('')}</div><div class="gd-phone"><div class="gd-camera"></div><div class="gd-status"><span>9:41</span><span>●●●  ▰</span></div>${header()}<div class="gd-content">${({list,detail,create,workout,workoutForm,composer})[s.page]()}</div>${foot()}${nav()}${sheet()}${s.toast?`<div class="gd-toast" role="status">${E(s.toast)}</div>`:''}</div></div>`;root.dataset.page=s.page;const el=root.querySelector('.gd-content');if(el)el.scrollTop=(oldPage===s.page?pos:0);if(s.page==='list'&&!s.reordering){updateOrphanLayout(root.querySelector('.gd-v7-grid'));if(oldPage!==s.page&&s.expandedId){requestAnimationFrame(()=>requestAnimationFrame(()=>alignExpandedCard(s.expandedId,{behavior:'instant',force:true})))}}}

/* V7.1: layout is based on the actual number of half-width widgets,
   not on nth-child, because the hero and the expanded card span full width. */
function updateOrphanLayout(grid){
 if(!grid)return;
 const tiles=[...grid.querySelectorAll(':scope > .gd-bento-item')];
 tiles.forEach(el=>el.classList.remove('gd-v7-orphan'));
 const half=tiles.filter(el=>!el.classList.contains('gd-bento-hero')&&!el.classList.contains('is-expanded'));
 if(half.length%2===1)half.at(-1).classList.add('gd-v7-orphan');
}
let cardScrollToken=0;
function alignExpandedCard(id,{behavior='smooth',force=false}={}){
 const container=root.querySelector('.gd-content');
 const card=[...root.querySelectorAll('[data-bento-id]')].find(el=>el.dataset.bentoId===id);
 if(!container||!card||!card.classList.contains('is-expanded')||s.expandedId!==id)return;
 const view=container.getBoundingClientRect(),box=card.getBoundingClientRect();
 const margin=14,peek=42;
 const safeTop=view.top+margin,safeBottom=view.bottom-peek;
 const available=safeBottom-safeTop;
 const needTop=box.height>available-12 || box.top<safeTop || box.top>safeBottom-95;
 let delta=0;
 if(needTop || (force && box.top>safeTop+24))delta=box.top-safeTop;
 else if(box.bottom>safeBottom){
   const toFit=box.bottom-safeBottom;
   // Do not hide the card heading merely to fit its bottom edge.
   delta=(box.top-toFit<safeTop)?box.top-safeTop:toFit;
 }
 if(Math.abs(delta)<3)return;
 const dest=Math.max(0,Math.min(container.scrollHeight-container.clientHeight,container.scrollTop+delta));
 if(Math.abs(dest-container.scrollTop)>3)container.scrollTo({top:dest,behavior});
}
function openRoutine(id){
 if(s.reordering)return;
 const container=root.querySelector('.gd-content'),grid=root.querySelector('.gd-v7-grid');
 if(!container||!grid)return;
 cardScrollToken++;
 const runToken=cardScrollToken;
 const before=new Map([...grid.querySelectorAll('[data-bento-id]')].map(el=>{
   const r=el.getBoundingClientRect();return [el.dataset.bentoId,{x:r.left,y:r.top}];
 }));
 const opening=s.expandedId!==id;
 s.expandedId=opening?id:null;
 const primary=s.routines.find(r=>r.primary)||s.routines[0];
 const others=s.routines.filter(r=>r.id!==primary.id);
 const visible=[primary,...others];
 if(s.expandedId&&s.expandedId!==primary.id){
   const ix=others.findIndex(r=>r.id===s.expandedId);
   // Right-hand tile swaps locally with its left neighbor, never with the hero.
   if(ix>=0&&ix%2===1)[visible[ix],visible[ix+1]]=[visible[ix+1],visible[ix]];
 }
 const nodes=new Map([...grid.querySelectorAll('[data-bento-id]')].map(el=>[el.dataset.bentoId,el]));
 visible.forEach(r=>grid.appendChild(nodes.get(r.id)));
 for(const [key,node] of nodes){
   const expanded=key===s.expandedId;
   node.classList.toggle('is-expanded',expanded);
   const tile=node.querySelector('.gd-card');
   tile.setAttribute('aria-expanded',String(expanded));
   tile.setAttribute('aria-label',(expanded?'Recolher ':'Expandir ')+s.routines.find(r=>r.id===key).name);
   const pane=node.querySelector('.gd-expand-shell');
   pane.setAttribute('aria-hidden',String(!expanded));
   if(expanded)pane.removeAttribute('inert');else pane.setAttribute('inert','');
 }
 updateOrphanLayout(grid);
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 for(const [key,node] of nodes){
   const from=before.get(key),after=node.getBoundingClientRect();
   if(!from||reduced)continue;
   const dx=from.x-after.left,dy=from.y-after.top;
   if(Math.abs(dx)+Math.abs(dy)>3)node.animate([
     {transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}
   ],{duration:340,easing:'cubic-bezier(.22,1,.36,1)'});
 }
 if(!opening)return;
 // The old algorithm evaluated scrollHeight while the 0fr->1fr expansion was
 // still collapsed, so Safari clamped the target and landed inside the card.
 // After layout settles, align the *actual* card top under the fixed header.
 // Align early so the title appears quickly, and once more after the transition.
 requestAnimationFrame(()=>{
   if(runToken!==cardScrollToken||s.expandedId!==id)return;
   alignExpandedCard(id,{behavior:reduced?'instant':'smooth'});
 });
 setTimeout(()=>{
   if(runToken!==cardScrollToken||s.expandedId!==id)return;
   alignExpandedCard(id,{behavior:reduced?'instant':'smooth'});
 },380);
}
function beginRoutine(edit=false){s.editing=edit;const r=rById();s.form=edit?{name:r.name,mode:r.mode,tone:r.tone,art:r.art}:{name:'',mode:'Musculação',tone:'blue',art:'muscle'};setPage('create')}
function beginWorkout(){let w=work(rById(),s.day);s.workoutDraft=w?{title:w.title,exercises:JSON.parse(JSON.stringify(w.exercises))}:{title:'',exercises:[]};s.activeEx=0;setPage('composer')}
function startReorder(){const primary=s.routines.find(r=>r.primary)||s.routines[0];const others=s.routines.filter(r=>r.id!==primary?.id);if(others.length<2){s.sheet=null;toast('Crie outra rotina para reorganizar');return}s.reordering=true;s.reorderOriginal=s.routines.map(r=>r.id);s.expandedId=null;s.sheet=null;render()}
function finishReorder(){s.reordering=false;s.reorderOriginal=null;render();toast('Ordem das rotinas atualizada')}
function cancelReorder(){if(s.reorderOriginal){s.routines.sort((a,b)=>s.reorderOriginal.indexOf(a.id)-s.reorderOriginal.indexOf(b.id))}s.reordering=false;s.reorderOriginal=null;render()}
function moveRoutine(id,delta){const primary=s.routines.find(r=>r.primary)||s.routines[0];const others=s.routines.filter(r=>r.id!==primary?.id);const from=others.findIndex(r=>r.id===id);const to=Math.max(0,Math.min(others.length-1,from+delta));if(from<0||from===to)return;const moved=others.splice(from,1)[0];others.splice(to,0,moved);s.routines=[primary,...others];render()}
function goBack(){if(s.sheet){s.sheet=null;render();return}if(s.page==='list'&&s.reordering){cancelReorder();return}switch(s.page){case 'list':toast('Você está em Rotinas');break;case 'create':setPage('list');break;case 'workout':setPage('list');break;case 'composer':setPage(work(rById(),s.day)?'workout':'list');break;default:setPage('list')}}
root.addEventListener('click',(event)=>{const a=event.target.closest('[data-action]');if(!a||!root.contains(a))return;let action=a.dataset.action, id=a.dataset.id, value=a.dataset.value;if(action==='close-sheet'&&event.target!==a&&event.target.closest('.gd-sheet'))return;
switch(action){case 'scene':s.scenario=value;s.routines=value==='empty'?[]:value==='one'?seed.slice(0,1).map(v=>JSON.parse(JSON.stringify(v))):seed.map(v=>JSON.parse(JSON.stringify(v)));s.selectedId='r1';s.sheet=null;s.page='list';s.expandedId=null;s.daysByRoutine={};s.reordering=false;s.reorderOriginal=null;render();break;
case 'back':goBack();break;case 'expand':openRoutine(id);break;case 'inline-day':s.daysByRoutine[id]=Number(a.dataset.day);render();break;case 'workout-from-card':{s.selectedId=id;s.day=Number(a.dataset.day);if(work(rById(),s.day))setPage('workout');else beginWorkout();break}case 'open-day':s.selectedId=id;s.day=Number(a.dataset.day);setPage('workout');break;case 'start-reorder':startReorder();break;case 'finish-reorder':finishReorder();break;case 'move-routine-up':moveRoutine(id,-1);break;case 'move-routine-down':moveRoutine(id,1);break;case 'drag-handle':break;case 'new':beginRoutine();break;case 'open':openRoutine(id);break;case 'menu':s.sheet={type:'routine',id};render();break;case 'day':s.day=Number(a.dataset.day);render();break;
case 'modality':s.form.mode=value;render();break;case 'cover':s.form.tone=value;render();break;
case 'save-routine':{if(!s.form.name.trim()){toast('Dê um nome para a rotina');return}if(s.editing){Object.assign(rById(),s.form);s.form=null;s.expandedId=s.selectedId;setPage('list');}else{let nr={id:'r'+Date.now(),name:s.form.name.trim(),mode:s.form.mode,tone:s.form.tone,art:s.form.mode==='Corrida'?'run':s.form.mode==='Yoga'?'yoga':'free',primary:s.routines.length===0,autoAdjust:false,workouts:{}};s.routines.push(nr);s.selectedId=nr.id;s.form=null;s.day=0;s.daysByRoutine[nr.id]=0;s.expandedId=nr.id;setPage('list')}}break;
case 'make-primary':s.routines.forEach(r=>r.primary=r.id===id);s.sheet=null;setPage('list');break;
case 'edit-routine':s.selectedId=id;beginRoutine(true);break;
case 'duplicate':{let orig=s.routines.find(r=>r.id===id);let cp=JSON.parse(JSON.stringify(orig));cp.id='r'+Date.now();cp.name=orig.name+' — cópia';cp.primary=false;s.routines.push(cp);s.selectedId=cp.id;s.day=0;s.daysByRoutine[cp.id]=0;s.expandedId=cp.id;s.sheet=null;setPage('list');toast('Rotina duplicada');}break;
case 'share':s.sheet={type:'share'};render();break;case 'delete-routine':s.sheet={type:'delete',id};render();break;
case 'confirm-delete':s.routines=s.routines.filter(r=>r.id!==id);if(s.routines.length&&!s.routines.some(r=>r.primary))s.routines[0].primary=true;s.selectedId=s.routines[0]?.id||'r1';setPage('list');break;
case 'adjust-settings':s.selectedId=id;s.sheet={type:'adjust'};render();break;
case 'toggle-adjust':rById().autoAdjust=!rById().autoAdjust;render();break;
case 'open-workout':setPage('workout');break;case 'add-workout':case 'edit-workout':beginWorkout();break;
case 'continue-workout':setPage('composer');break;
case 'add-exercise':s.workoutDraft.exercises.push(ex(a.dataset.name));s.activeEx=s.workoutDraft.exercises.length-1;s.search='';render();break;
case 'next-ex':s.activeEx=Math.min(s.workoutDraft.exercises.length-1,s.activeEx+1);render();break;
case 'prev-ex':s.activeEx=Math.max(0,s.activeEx-1);render();break;
case 'exercise-menu':s.sheet={type:'exercise'};render();break;
case 'delete-exercise':s.workoutDraft.exercises.splice(s.activeEx,1);s.activeEx=Math.max(0,Math.min(s.activeEx,s.workoutDraft.exercises.length-1));s.sheet=null;render();break;
case 'reorder':s.sheet={type:'reorder'};render();break;
case 'move-up':case 'move-down':{const arr=s.workoutDraft.exercises,from=s.activeEx,to=Math.max(0,Math.min(arr.length-1,from+(action==='move-up'?-1:1)));if(from!==to){const t=arr.splice(from,1)[0];arr.splice(to,0,t);s.activeEx=to}s.sheet=null;render();break}
case 'substitutes':s.sheet={type:'substitutes'};render();break;
case 'pick-substitute':{let e=s.workoutDraft.exercises[s.activeEx];if(!e.alternatives.some(v=>v.name===a.dataset.name))e.alternatives.push(ex(a.dataset.name));s.sheet=null;render();break}
case 'choose-equipment':s.sheet={type:'equipment'};render();break;
case 'pick-equipment':s.workoutDraft.exercises[s.activeEx].equipment=a.dataset.name;s.sheet=null;render();break;
case 'save-workout':if(!s.workoutDraft?.exercises?.length){toast('Adicione ao menos um exercício');return}s.sheet={type:s.workoutDraft.exercises.length===1?'single-exercise-confirm':'name-workout'};render();break;
case 'continue-workout-edit':s.sheet=null;render();break;
case 'confirm-single-exercise':if(s.workoutDraft?.exercises?.length!==1){s.sheet=null;render();break}s.sheet={type:'name-workout'};render();break;
case 'confirm-save-workout':if(!s.workoutDraft?.exercises?.length){toast('Adicione ao menos um exercício');return}if(!s.workoutDraft?.title?.trim()){toast('Dê um nome para o treino');return}rById().workouts[s.day]=JSON.parse(JSON.stringify({...s.workoutDraft,title:s.workoutDraft.title.trim()}));s.daysByRoutine[s.selectedId]=s.day;s.expandedId=s.selectedId;s.workoutDraft=null;s.sheet=null;setPage('list');toast('Treino salvo');break;
case 'workout-menu':s.sheet={type:'workout'};render();break;
case 'move-workout':s.sheet={type:'move-workout'};render();break;
case 'pick-move-day':{let d=Number(a.dataset.day),r=rById();if(r.workouts[d]){toast('Este dia já tem um treino');return}r.workouts[d]=r.workouts[s.day];delete r.workouts[s.day];s.day=d;s.daysByRoutine[s.selectedId]=d;s.expandedId=s.selectedId;s.sheet=null;setPage('list');break}
case 'close-sheet':s.sheet=null;render();break;
case 'nav':if(value==='Rotinas')setPage('list');else toast(`${value} não faz parte deste teste`);break;
}}
);
root.addEventListener('input',e=>{let inp=e.target;if(inp.dataset.field==='name'&&s.form)s.form.name=inp.value;if(inp.dataset.field==='workout-title'&&s.workoutDraft){s.workoutDraft.title=inp.value;const save=root.querySelector('.gd-v7-confirm');if(save)save.disabled=!inp.value.trim()}if(inp.dataset.exField&&s.workoutDraft?.exercises[s.activeEx])s.workoutDraft.exercises[s.activeEx][inp.dataset.exField]=inp.value;if(inp.dataset.field==='search'){s.search=inp.value;let start=inp.selectionStart;render();let el=root.querySelector('#gd-ex-search');if(el){el.focus();try{el.setSelectionRange(start,start)}catch(ex){}}}});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="expand"]')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&e.target.id==='gd-final-name'){e.preventDefault();root.querySelector('[data-action="confirm-save-workout"]')?.click()}});
let drag=null;
root.addEventListener('pointerdown',e=>{const handle=e.target.closest('.gd-drag-handle');if(!handle||!s.reordering)return;e.preventDefault();const row=handle.closest('[data-reorder-id]');drag={id:row.dataset.reorderId,y:e.clientY,pointerId:e.pointerId,row};row.classList.add('is-dragging');try{handle.setPointerCapture(e.pointerId)}catch(err){}});
root.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const dy=e.clientY-drag.y;drag.row.style.transform=`translateY(${dy}px) scale(1.015)`;const rows=[...root.querySelectorAll('[data-reorder-id]')];rows.forEach(x=>x.classList.remove('is-drop-target'));const hovered=rows.find(x=>x!==drag.row&&e.clientY>=x.getBoundingClientRect().top&&e.clientY<=x.getBoundingClientRect().bottom);if(hovered)hovered.classList.add('is-drop-target')});
root.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const rows=[...root.querySelectorAll('[data-reorder-id]')];const startIdx=rows.findIndex(x=>x.dataset.reorderId===drag.id);const centers=rows.map(x=>({id:x.dataset.reorderId,rect:x.getBoundingClientRect()}));const target=centers.find(x=>x.id!==drag.id&&e.clientY>=x.rect.top&&e.clientY<=x.rect.bottom);const delta=target?rows.findIndex(x=>x.dataset.reorderId===target.id)-startIdx:Math.round((e.clientY-drag.y)/78);drag.row.style.transform='';drag.row.classList.remove('is-dragging');drag=null;if(delta)moveRoutine(rows[startIdx].dataset.reorderId,delta);else render()});
root.addEventListener('pointercancel',()=>{if(drag){drag.row.style.transform='';drag=null;render()}});
let start=null;root.addEventListener('pointerdown',e=>{let el=e.target.closest('[data-swipe]');if(!el||e.target.closest('button,input'))return;start={x:e.clientX,y:e.clientY,type:el.dataset.swipe}});
root.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y,type=start.type;start=null;if(Math.abs(dx)<48||Math.abs(dy)>Math.abs(dx)*.85)return;if(type==='day'&&s.page==='detail'){s.day=Math.max(0,Math.min(6,s.day+(dx<0?1:-1)));render()}if(type==='exercise'&&s.page==='composer'){s.activeEx=Math.max(0,Math.min(s.workoutDraft.exercises.length-1,s.activeEx+(dx<0?1:-1)));render()}});
render();
})();
